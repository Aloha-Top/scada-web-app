<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบบริหารและติดตามงานจัดซื้อจัดจ้าง</title>
<style>
:root{
  --navy:#16324F; --navy-2:#1E4268; --navy-3:#0F2437;
  --paper:#F2F4F7; --surface:#FFFFFF; --line:#DCE1E8;
  --ink:#1B2631; --ink-2:#55606E; --ink-3:#8A94A2;
  --teal:#0E7C66; --teal-soft:#E3F2EE;
  --amber:#A15C00; --amber-soft:#FCF0DC;
  --red:#B3261E; --red-soft:#FBE7E5;
  --blue:#1D5FA8; --blue-soft:#E4EEFA;
  --grey-soft:#EDF0F4;
  --r:10px; --r-sm:6px;
  --sh:0 1px 2px rgba(22,50,79,.08), 0 6px 18px rgba(22,50,79,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Sarabun","Noto Sans Thai","IBM Plex Sans Thai","Leelawadee UI","Tahoma",sans-serif;
  background:var(--paper); color:var(--ink); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--blue)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c3cad4;border-radius:8px;border:2px solid var(--paper)}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:248px;flex:0 0 248px;background:var(--navy);color:#DCE6F0;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand b{display:block;font-size:16px;color:#fff;font-weight:700;letter-spacing:.2px}
.brand span{font-size:12.5px;color:#9DB3C9}
.nav{padding:12px 10px;flex:1;overflow:auto}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;color:#C7D6E6;padding:10px 12px;border-radius:var(--r-sm);
  cursor:pointer;margin-bottom:2px;font-size:14.5px;
}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.active{background:#fff;color:var(--navy);font-weight:600}
.nav .ic{width:18px;text-align:center;opacity:.9}
.nav .count{margin-left:auto;background:rgba(255,255,255,.16);color:#fff;border-radius:20px;
  font-size:11.5px;padding:1px 8px}
.nav button.active .count{background:var(--navy);color:#fff}
.sidebar .foot{padding:12px 18px;font-size:11.5px;color:#7F97B0;border-top:1px solid rgba(255,255,255,.1)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  background:var(--surface);border-bottom:1px solid var(--line);
  padding:14px 26px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20
}
.topbar h1{font-size:19px;margin:0;font-weight:700}
.topbar .sub{font-size:12.5px;color:var(--ink-3)}
.topbar .spacer{flex:1}
.view{padding:22px 26px 60px;max-width:1400px;width:100%}

/* ---------- atoms ---------- */
.btn{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);
  padding:8px 14px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{background:#F7F9FB;border-color:#c6cede}
.btn:focus-visible,.nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--blue);outline-offset:1px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost-danger{color:var(--red);border-color:#E9C9C6}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card .hd h3{margin:0;font-size:15.5px;font-weight:700}
.card .hd .spacer{flex:1}
.card .bd{padding:18px}
.grid{display:grid;gap:16px}

.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:20px;
  font-size:12.5px;font-weight:600;white-space:nowrap}
.badge.grey{background:var(--grey-soft);color:var(--ink-2)}
.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.teal{background:var(--teal-soft);color:var(--teal)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.red{background:var(--red-soft);color:var(--red)}

label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px}
label.f>span i{color:var(--red);font-style:normal}
input[type=text],input[type=date],input[type=number],input[type=email],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:#fff;transition:border-color .12s
}
input:hover,select:hover,textarea:hover{border-color:#c6cede}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(29,95,168,.12)}
textarea{min-height:76px;resize:vertical}
input[readonly]{background:#F4F6F9;color:var(--ink-2)}
.num{text-align:right}
.cols{display:grid;gap:0 16px}
.c2{grid-template-columns:repeat(2,1fr)}
.c3{grid-template-columns:repeat(3,1fr)}
.c4{grid-template-columns:repeat(4,1fr)}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--ink-2);font-size:12.5px;
  background:#F6F8FA;border-bottom:1px solid var(--line);padding:9px 10px;white-space:nowrap}
td{border-bottom:1px solid #EDF0F4;padding:9px 10px;vertical-align:middle}
tbody tr:hover{background:#FAFBFD}
.tbl-wrap{overflow-x:auto}
.t-right{text-align:right}
.t-center{text-align:center}
.link{color:var(--blue);cursor:pointer;font-weight:600}
.link:hover{text-decoration:underline}
.empty{padding:38px 18px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink-2);margin-bottom:4px;font-size:15px}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh)}
.kpi .l{font-size:12.5px;color:var(--ink-2)}
.kpi .v{font-size:23px;font-weight:700;letter-spacing:-.4px;margin-top:2px}
.kpi .u{font-size:12px;color:var(--ink-3);font-weight:400;margin-left:3px}
.kpi.accent{background:var(--navy);border-color:var(--navy);color:#fff}
.kpi.accent .l{color:#A9C0D6}
.kpi.accent .u{color:#A9C0D6}
.chart-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
canvas{width:100%;display:block}
.filters{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:end}
.alert-row{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #EDF0F4}
.alert-row:last-child{border-bottom:0}
.alert-row .dot{width:8px;height:8px;border-radius:50%;margin-top:8px;flex:0 0 8px}
.alert-row .body{flex:1;min-width:0}
.alert-row .t{font-weight:600}
.alert-row .m{font-size:13px;color:var(--ink-2)}

/* ---------- timeline ---------- */
.timeline{display:flex;flex-direction:column}
.tl-step{display:flex;gap:14px;cursor:pointer;border-radius:var(--r-sm);padding:8px;margin:-8px -8px 0}
.tl-step:hover{background:#F6F8FB}
.tl-rail{display:flex;flex-direction:column;align-items:center;flex:0 0 28px}
.tl-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;border:2px solid var(--line);background:#fff;color:var(--ink-3)}
.tl-line{flex:1;width:2px;background:var(--line);min-height:16px}
.tl-step.done .tl-dot{background:var(--teal);border-color:var(--teal);color:#fff}
.tl-step.done .tl-line{background:var(--teal)}
.tl-step.doing .tl-dot{background:#fff;border-color:var(--blue);color:var(--blue);
  box-shadow:0 0 0 4px rgba(29,95,168,.15)}
.tl-body{padding-bottom:14px;flex:1;min-width:0}
.tl-body .n{font-weight:600}
.tl-body .meta{font-size:12.5px;color:var(--ink-3)}

/* ---------- modal / toast ---------- */
.mask{position:fixed;inset:0;background:rgba(17,28,40,.45);display:flex;align-items:flex-start;
  justify-content:center;padding:40px 16px;z-index:100;overflow:auto}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(10,25,40,.3)}
.modal.wide{max-width:1020px}
.modal.narrow{max-width:440px}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h3{margin:0;font-size:16.5px}
.modal .mb{padding:20px;max-height:66vh;overflow:auto}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:#FAFBFD;border-radius:0 0 12px 12px}
.x{margin-left:auto;background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-3);padding:0 4px}
.x:hover{color:var(--ink)}
#toastRoot{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy-3);color:#fff;padding:11px 16px;border-radius:var(--r-sm);
  box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px;animation:tin .18s ease-out}
.toast.ok{background:var(--teal)} .toast.err{background:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.section-h{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.section-h .tag{background:var(--navy);color:#fff;width:24px;height:24px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.section-h h3{margin:0;font-size:15.5px}
.hint{font-size:12.5px;color:var(--ink-3)}
.totals{display:grid;grid-template-columns:1fr auto;gap:6px 24px;max-width:430px;margin-left:auto;font-size:14.5px}
.totals .lab{color:var(--ink-2)}
.totals .val{text-align:right;font-variant-numeric:tabular-nums}
.totals .grand{border-top:1px solid var(--line);padding-top:8px;margin-top:4px;font-weight:700;font-size:17px}
.baht-text{background:var(--teal-soft);color:#0B5C4B;border-radius:var(--r-sm);padding:8px 12px;
  margin-top:12px;font-size:14px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:13px;background:#fff;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.type-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.type-pick button{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:22px 18px;
  cursor:pointer;text-align:left}
.type-pick button:hover{border-color:var(--navy);background:#F7FAFD}
.type-pick .e{font-size:26px}
.type-pick .n{font-weight:700;margin-top:8px}
.type-pick .d{font-size:13px;color:var(--ink-3)}
.imgs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.imgs figure{margin:0;position:relative;width:118px}
.imgs img{width:118px;height:88px;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--line)}
.imgs button{position:absolute;top:4px;right:4px;background:rgba(20,30,40,.75);color:#fff;border:0;
  border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:1}
.head-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 20px}
.fact .k{font-size:12.5px;color:var(--ink-3)}
.fact .v{font-weight:600}
.dl{display:grid;grid-template-columns:200px 1fr;gap:8px 16px;font-size:14.5px}
.dl .k{color:var(--ink-2)}
@media(max-width:1180px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .filters{grid-template-columns:repeat(3,1fr)}
  .chart-grid{grid-template-columns:1fr}
  .head-facts{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:860px){
  .sidebar{width:68px;flex:0 0 68px}
  .brand span,.nav .lbl,.nav .count,.sidebar .foot{display:none}
  .brand b{font-size:13px}
  .nav button{justify-content:center;padding:11px 0}
  .c3,.c4,.c2{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .filters{grid-template-columns:1fr 1fr}
  .view{padding:16px}
  .dl{grid-template-columns:1fr}
}

/* ---------- เอกสาร A4 / Print ----------
   Preview และ Print ใช้ CSS ชุดเดียวกันทั้งหมด (ไม่มี stylesheet แยกสำหรับ Print
   นอกจาก @media print ที่ซ่อน UI ของแอปและปิด box-shadow/พื้นหลังเทาเท่านั้น
   ขนาดหน้ากระดาษ .sheet/.sheet-in ใช้ค่าเดียวกันทั้งสองบริบท
   ระยะขอบ/ฟอนต์/ระยะบรรทัดอ้างอิงจากไฟล์ต้นฉบับ (.docx sectPr + docDefaults) โดยตรง:
   หน้ากระดาษ A4 (210×297mm), ขอบบน 14.3mm, ซ้าย 30.0mm, ขวา 15.0mm, ขอบล่างเกือบ 0,
   ฟอนต์ TH SarabunPSK 16pt, เส้นบรรทัด auto 276/240 = 1.15 เท่า */
#printRoot{display:none}
.doc-viewer{position:fixed;inset:0;background:#55606E;z-index:300;overflow:auto;padding:0 0 60px}
.doc-toolbar{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;gap:12px;
  align-items:center;padding:10px 18px;margin-bottom:20px}
.doc-toolbar .sp{flex:1}
/* .sheet = กระดาษ A4 หนึ่งแผ่นจริง ความสูงคงที่ 297mm เสมอ (ไม่ใช่ min-height)
   เพื่อให้ Preview บนจอกับผล Print มีขนาดหน้าเท่ากันทุกครั้ง — เนื้อหาถูกจัดสรรระหว่าง
   .page-1/.page-2 ไว้ล่วงหน้าโดย step1DocHTML() ไม่ปล่อยให้ Browser ตัดหน้าเอง */
.sheet{position:relative;width:210mm;height:297mm;box-sizing:border-box;
  background:#fff;margin:0 auto 18px;box-shadow:0 6px 24px rgba(0,0,0,.35);overflow:visible;
  font-family:"TH SarabunPSK","TH Sarabun New","THSarabunNew","Sarabun","Noto Sans Thai",Tahoma,sans-serif;
  font-size:var(--docfs,15pt);line-height:1.12;color:#000;
  break-after:page;page-break-after:always}
.sheet:last-child{break-after:auto;page-break-after:auto}
/* สำคัญ: ไม่ใช้ display:flex/grid ที่นี่ (หน้า 1 เป็น normal flow ล้วน ๆ)
   หน้า 2 ใช้ grid เฉพาะจุด (ดู .page-2 .sheet-in ด้านล่าง) เพื่อวาง Footer ท้ายหน้า
   โดยไม่ต้องใช้ margin ขนาดใหญ่หรือ position:absolute/fixed */
.sheet-in{height:100%;box-sizing:border-box;padding:14.3mm 15mm 3mm 30mm;display:block}
.page-2 .sheet-in{display:grid;grid-template-rows:auto 1fr auto}
/* หนังสือต่อรองราคา (STEP 2) — เอกสาร 1 หน้า ใช้ grid เดียวกันเพื่อดัน Footer ไปท้ายหน้า
   โดยไม่กระทบ .page-2 ของ STEP 1 (คนละ class กันคนละ selector) */
.nego-page{line-height:1.18}
.nego-page .sheet-in{display:grid;grid-template-rows:auto 1fr auto}
.nego-address p{margin:0}
/* STEP 2: ระยะระหว่างบรรทัดสุดท้ายของที่อยู่กับเดือน/ปี
   ต้องเจาะจงกว่า .sheet p{margin:0} ด้านล่าง เพื่อไม่ให้ margin ถูก override */
.nego-page .nego-date{
  text-align:center;
  margin:5mm 0 0 0;
}
/* STEP 2: กำหนดแนวขวาของเนื้อหาให้ตรงกับแนวขวาของตารางราคา (16cm)
   ทำให้ตัวอักษรสุดท้ายของย่อหน้าไม่ยื่นเลยเส้นขวาของตาราง */
.nego-page .nego-subject,
.nego-page .nego-attn,
.nego-page p.nego-body,
.nego-page .d-page2-content > p.d-ind{
  width:16cm;
  max-width:16cm;
  box-sizing:border-box;
}
.nego-subject{margin-top:5mm}
.nego-attn{margin-top:2mm}
.nego-body{margin-top:4mm}
.nego-sign-block{width:100%;margin-top:8mm;text-align:center}
.nego-sign-block p{margin:0}
/* รายงานผลการพิจารณา/ขออนุมัติ (STEP 3) — เอกสาร 1 หน้า ไม่มี Footer ในต้นฉบับจริง (ตรวจสอบจาก
   PDF Source of Truth แล้ว) จึงไม่ต้องดันด้วย grid เหมือน STEP 1/2 — ใช้ normal document flow
   ล้วน ๆ ระยะห่างทั้งหมดปรับเทียบจากตำแหน่งบรรทัดจริงในไฟล์ PDF ต้นฉบับ (วัดค่าพิกัดจริง)
   ไม่กระทบ .page-2 ของ STEP 1 หรือ .nego-page ของ STEP 2 (คนละ class กันคนละ selector) */
.result-page{line-height:1.2}
.result-head{margin-bottom:0}
.result-body p{margin:0}
/* เนื้อหาไหลต่อเนื่องแบบเอกสารต้นฉบับ (ไม่มีช่องว่างระหว่างย่อหน้า เรียน/ตามที่/ได้เจรจา) */
.result-summary p{margin:0}
/* ตารางรายงานผลฯ ใช้ selector เจาะจงเฉพาะ .result-page เพื่อไม่ให้ Global table/th/td ของ UI
   (table{font-size:14px}, th{font-size:12.5px}, td{border-bottom:#EDF0F4}) มามีผลกับเอกสารนี้ได้เลย
   ไม่ใช่ .d-tbl ของ STEP1/2 — แยกอิสระสมบูรณ์ตามที่ระบุ */
.result-page .result-table{border-collapse:collapse;width:16.3cm;font-size:inherit;
  font-family:inherit;margin:3mm 0 2mm;color:#000}
.result-page .result-table th,.result-page .result-table td{
  border:1px solid #000;padding:.8mm 2mm;vertical-align:middle;font-weight:400;
  font-size:inherit;font-family:inherit;line-height:inherit;color:#000}
.result-page .result-table th{font-weight:700;text-align:center}
.result-page .result-table thead{display:table-header-group}
.result-page .result-table tr{break-inside:avoid;page-break-inside:avoid}
/* ลายเซ็นเจ้าหน้าที่: บรรทัด "ลงชื่อ...เจ้าหน้าที่" ใช้ระยะเยื้องแบบเดียวกับ STEP1 (.d-sign เดิม
   ไม่แก้ไข) ส่วนชื่อ/ตำแหน่งจัดกึ่งกลางใต้แนวเส้นเซ็นเฉพาะ ไม่ใช่กึ่งกลางทั้งหน้า */
.result-sign{margin-top:7mm}
.result-sign p{margin:0}
.result-sign .result-signee{margin-left:9.4cm;width:5.45cm;text-align:center}
/* กรอบผู้รับมอบอำนาจของ STEP 3 — class ใหม่แยกจาก .d-approve ของ STEP 1 โดยเจตนา อยู่ชิดซ้าย */
.result-approve-box{width:7.7cm;border:1px solid #000;padding:.15cm .3cm;margin-top:6mm}
.result-approve-box p{margin:0}

function fmtDate(iso){                       // 2026-07-23 -> 23 ก.ค. 2569
  if(!iso) return '-';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return esc(iso);
  return d.getDate()+' '+TH_M[d.getMonth()]+' '+(d.getFullYear()+543);
}
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function daysBetween(a,b){                   // b - a เป็นจำนวนวัน
  if(!a||!b) return null;
  const x=new Date(a+'T00:00:00'), y=new Date(b+'T00:00:00');
  if(isNaN(x)||isNaN(y)) return null;
  return Math.round((y-x)/86400000);
}
/* ปีงบประมาณไทย: เริ่ม 1 ต.ค. */
function fiscalYearOf(iso){
  if(!iso) return null;
  const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return null;
  const be = d.getFullYear()+543;
  return d.getMonth()>=9 ? be+1 : be;
}
function currentFiscalYear(){ return fiscalYearOf(todayISO()); }

/* ---- แปลงตัวเลขเป็นตัวอักษรภาษาไทย ---- */
function bahtText(amount){
  const n = Math.round(num(amount)*100)/100;
  if(n===0) return 'ศูนย์บาทถ้วน';
  const neg = n<0; const abs = Math.abs(n);
  const baht = Math.floor(abs);
  const satang = Math.round((abs-baht)*100);
  let s = (baht>0 ? readThai(String(baht))+'บาท' : '');
  if(satang>0) s += (baht>0?'':'') + readThai(String(satang))+'สตางค์';
  else s += 'ถ้วน';
  return (neg?'ลบ':'')+s;
}
function readThai(intStr){
  const D=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'];
  const P=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  intStr = String(intStr).replace(/^0+/,''); if(intStr==='') return '';
  if(intStr.length>6){                      // ตัดเป็นหลักล้าน
    const head = intStr.slice(0,intStr.length-6), tail = intStr.slice(-6);
    return readThai(head)+'ล้าน'+(tail.replace(/0/g,'')===''?'':readThai(tail));
  }
  let out='';
  const L=intStr.length;
  for(let i=0;i<L;i++){
    const dg = +intStr[i], pos = L-i-1;
    if(dg===0) continue;
    if(pos===0 && dg===1 && L>1) out+='เอ็ด';
    else if(pos===1 && dg===1) out+='สิบ';
    else if(pos===1 && dg===2) out+='ยี่สิบ';
    else out += D[dg]+P[pos];
  }
  return out;
}

let DB = null;

function emptyDB(){
  const master={}; MASTERS.forEach(m=>master[m.key]=[]);
  return {
    meta:{ version:APP.version, seq:{} },
    settings:{ orgName:'', defaultVat:7, defaultFiscalYear:currentFiscalYear(), org: Object.assign({}, ORG_DEFAULTS) },
    master: master,
    projects: []
  };
}
function loadDB(){
  try{
    const raw = localStorage.getItem(APP.key);
    if(!raw){ DB = seedDB(); saveDB(); return; }
    DB = JSON.parse(raw);
    const base = emptyDB();
    DB.meta = Object.assign(base.meta, DB.meta||{});
    DB.settings = Object.assign(base.settings, DB.settings||{});
    DB.settings.org = Object.assign({}, ORG_DEFAULTS, DB.settings.org||{});
    DB.master = Object.assign(base.master, DB.master||{});
    DB.projects = DB.projects||[];
    DB.projects.forEach(normalizeProject);
  }catch(e){
    console.error(e);
    DB = emptyDB();
    toast('อ่านข้อมูลเดิมไม่สำเร็จ เริ่มต้นด้วยข้อมูลว่าง','err');
  }
}
function saveDB(){
  try{
    localStorage.setItem(APP.key, JSON.stringify(DB));
    scheduleCloudSync();
    return true;
  }catch(e){
    console.error(e);
    toast('บันทึกไม่สำเร็จ พื้นที่จัดเก็บในเบราว์เซอร์เต็ม ลองลบรูปภาพบางรูปออก','err');
    return false;

}

function reasonLibrary(){
  DB.reasonLibrary = Array.isArray(DB.reasonLibrary) ? DB.reasonLibrary : [];
  return DB.reasonLibrary;

function normalizeEquipmentName(v){
  return String(v||'').trim().toLowerCase()
    .replace(/^(จัดซื้อ|ซื้อ|จ้างซ่อม|ซ่อม)\s*/,'')
    .replace(/\s*(จำนวน\s*)?\d+(?:\.\d+)?\s*(ชุด|เครื่อง|อัน|รายการ|ตัว|ใบ|ชิ้น)\s*$/,'')
    .replace(/\s+/g,' ').trim();
}
function reasonCandidates(p){
  const out=[];
  (p.items||[]).forEach(x=>{ if(x&&x.name) out.push(String(x.name).trim()); });
  if(p.name) out.push(String(p.name).trim());
  return [...new Set(out.filter(Boolean))];
}
function historicalReasonTemplate(p){
  const typeKey=(p&&p.typeKey)||'';
  const keys=reasonCandidates(p).map(normalizeEquipmentName).filter(Boolean);
  if(!keys.length) return null;
  const rows=(DB.projects||[])
    .filter(x=>x!==p && x.typeKey===typeKey && String(x.reason||'').trim())
    .sort((a,b)=>String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||'')));
  for(const old of rows){
    const oldKeys=reasonCandidates(old).map(normalizeEquipmentName).filter(Boolean);
    if(keys.some(k=>oldKeys.includes(k))){
      return {equipmentName:reasonCandidates(old)[0]||old.name,reason:old.reason,source:'history'};
    }
  }
  return null;
}
function findReasonTemplate(p){
  const typeKey=(p&&p.typeKey)||'';
  const keys=reasonCandidates(p).map(normalizeEquipmentName).filter(Boolean);
  if(!keys.length) return null;
  const saved=reasonLibrary().find(x=>x.typeKey===typeKey && keys.includes(normalizeEquipmentName(x.equipmentName)));
  return saved || historicalReasonTemplate(p);
}
function saveReasonTemplate(p,name,reason){
  name=String(name||'').trim(); reason=String(reason||'').trim();
  if(!name||!reason) return false;
  const lib=reasonLibrary(), key=normalizeEquipmentName(name), typeKey=(p&&p.typeKey)||'';
  let x=lib.find(v=>v.typeKey===typeKey && normalizeEquipmentName(v.equipmentName)===key);
  if(x){ x.reason=reason; x.equipmentName=name; x.updatedAt=new Date().toISOString(); }
  else lib.push({id:uid('rsn'),typeKey,equipmentName:name,reason,updatedAt:new Date().toISOString()});
  saveDB(); return true;
}
function equipmentNameForReason(p){
  const item=(p.items||[]).find(x=>String(x.name||'').trim());
  return item ? String(item.name).trim() : String(p.name||'').trim();
}

  wrap.appendChild(box);

  const syncNames=()=>{
    /* อ่านค่าล่าสุดจากหน้าฟอร์มก่อนค้นหา */
    const nameEl=$('[data-bind="name"]');
    if(nameEl) p.name=nameEl.value;
    const rows=$$('#itemsBody tr');
    if(rows.length){
      p.items=p.items||[];
      rows.forEach((tr,i)=>{
        p.items[i]=p.items[i]||{};
        const el=tr.querySelector('[data-k="name"]');
        if(el) p.items[i].name=el.value;
      });
    }
  };
  const fill=(force)=>{
    syncNames();
    const tpl=findReasonTemplate(p);
    if(!tpl) return false;
    if(force || !String(reasonEl.value||'').trim()){
      reasonEl.value=tpl.reason; p.reason=tpl.reason; return true;
    }
    return false;
  };

  /* งานใหม่: ลองจากข้อมูลที่มีอยู่แล้ว */
  fill(false);

  /* พิมพ์ชื่องานแล้วออกจากช่อง -> ถ้าเหตุผลยังว่าง ให้ค้นและเติมทันที */
  const nameEl=$('[data-bind="name"]');
  if(nameEl){
    nameEl.addEventListener('change',()=>fill(false));
    nameEl.addEventListener('blur',()=>fill(false));
  }

  $('[data-reason-fill]',box).onclick=()=>{
    if(!fill(true)) alert('ยังไม่พบเหตุผลและความจำเป็นจากงานเดิมสำหรับชื่ออุปกรณ์นี้ในประเภทงานนี้');
  };
  $('[data-reason-save]',box).onclick=()=>{
    syncNames(); p.reason=reasonEl.value;
    const name=equipmentNameForReason(p);
    if(!name){ alert('กรุณาระบุชื่ออุปกรณ์/รายการก่อน'); return; }
    if(!String(reasonEl.value||'').trim()){ alert('กรุณากรอกเหตุผลและความจำเป็นก่อนบันทึกต้นแบบ'); return; }
    saveReasonTemplate(p,name,reasonEl.value);
    alert('บันทึกข้อความต้นแบบสำหรับ “'+name+'” แล้ว');
  };
}

/* ---- computed ---- */
function itemAmount(it){ return num(it.qty)*num(it.unitPrice); }
function calcTotals(p){
  const sub = (p.items||[]).reduce((s,it)=>s+itemAmount(it),0);
  const rate = num(p.vatRate);
  const vat = Math.round(sub*rate)/100;
  return { sub: sub, vatRate: rate, vat: vat, grand: Math.round((sub+vat)*100)/100 };
}
function currentStep(p){
  for(let i=0;i<STEPS.length;i++){ if(p.workflow[STEPS[i].key].status!=='done') return STEPS[i]; }
  return STEPS[STEPS.length-1];
}
function projectStatus(p){
  if(p.workflow[STEPS[STEPS.length-1].key].status==='done') return 'done';
  const any = STEPS.some(s=> p.workflow[s.key].status!=='none');
  return any ? 'doing' : 'none';
}
function deliveryState(p){      // สถานะการส่งมอบเทียบกำหนด
  const d = p.workflow.s5.data||{};
  if(!d.dueDate) return null;
  if(d.deliveredDate){
    const diff = daysBetween(d.deliveredDate, d.dueDate);   // + = ก่อนกำหนด
    if(diff>0)  return {kind:'early', cls:'teal',  text:'ส่งก่อนกำหนด '+diff+' วัน', days:diff};
    if(diff===0)return {kind:'ontime',cls:'teal',  text:'ส่งตรงกำหนด', days:0};
    return {kind:'late', cls:'red', text:'เกินกำหนด '+(-diff)+' วัน', days:diff};
  }
  const left = daysBetween(todayISO(), d.dueDate);
  if(left<0)  return {kind:'overdue', cls:'red',   text:'เกินกำหนดส่งมอบ '+(-left)+' วัน', days:left};
  if(left<=7) return {kind:'soon',    cls:'amber', text:'เหลือ '+left+' วันครบกำหนดส่งมอบ', days:left};
  return {kind:'wait', cls:'grey', text:'ครบกำหนด '+fmtDate(d.dueDate), days:left};
}
function alertsFor(p){
  const out=[]; const wf=p.workflow;
  const ds = deliveryState(p);
  if(ds && (ds.kind==='overdue'||ds.kind==='soon') && wf.s5.status!=='done')
    out.push({level: ds.kind==='overdue'?'red':'amber', text: ds.text});
  if((wf.s5.status==='done' || (wf.s5.data||{}).deliveredDate) && wf.s6.status!=='done')
    out.push({level:'blue', text:'ส่งมอบแล้ว รอตรวจรับ'});
  if(wf.s6.status==='done' && wf.s7.status!=='done')
    out.push({level:'blue', text:'ตรวจรับแล้ว รอเบิกจ่าย'});
  if(wf.s7.status==='done' && wf.s8.status!=='done')
    out.push({level:'grey', text:'เบิกจ่ายแล้ว รอปิดงาน'});
  const pv = (wf.s3.data||{}).priceValidUntil;
  if(pv && wf.s5.status!=='done'){
    const left = daysBetween(todayISO(), pv);
    if(left!=null && left<0) out.push({level:'red', text:'เลยกำหนดยืนราคามาแล้ว '+(-left)+' วัน'});
    else if(left!=null && left<=7) out.push({level:'amber', text:'เหลือ '+left+' วันครบกำหนดยืนราคา'});
  }
  const rd = (wf.s2.data||{}).replyDue;
  if(rd && wf.s2.status==='doing'){
    const left = daysBetween(todayISO(), rd);
    if(left!=null && left<=3) out.push({level:left<0?'red':'amber', text: left<0? 'บริษัทยังไม่ตอบกลับ เกินกำหนด '+(-left)+' วัน' : 'รอบริษัทตอบกลับ อีก '+left+' วัน'});
  }
  return out;
}

  const alertCount = DB.projects.reduce((s,p)=> s + (alertsFor(p).some(a=>a.level==='red'||a.level==='amber')?1:0), 0);
  $('#nav').innerHTML = PAGES.map(p=>{
    let badge='';
    if(p.key==='list') badge = '<span class="count">'+DB.projects.length+'</span>';
    if(p.key==='alerts' && alertCount) badge = '<span class="count">'+alertCount+'</span>';
    return '<button data-page="'+p.key+'" class="'+(route.page===p.key?'active':'')+'" title="'+esc(p.label)+'">'+
      '<span class="ic">'+p.icon+'</span><span class="lbl">'+esc(p.label)+'</span>'+badge+'</button>';
  }).join('');
  $$('#nav button').forEach(b=> b.onclick=()=> go(b.dataset.page));
}
function go(page,id){
  route = {page:page, id:id||null};
  window.scrollTo(0,0);
  render();
}
function render(){
  renderNav(); refreshDatalists();
  const meta = PAGES.find(p=>p.key===route.page);
  $('#pageTitle').textContent = route.page==='detail' ? 'แฟ้มงาน' : (meta?meta.title:'');
  $('#pageSub').textContent = '';
  $('#topActions').innerHTML='';
  const v = $('#view');
  if(route.page==='dashboard') pageDashboard(v);
  else if(route.page==='new') pageNew(v);
  else if(route.page==='form') pageForm(v);
  else if(route.page==='list') pageList(v);
  else if(route.page==='alerts') pageAlerts(v);
  else if(route.page==='master') pageMaster(v);
  else if(route.page==='org') pageOrg(v);
  else if(route.page==='settings') pageSettings(v);
  else if(route.page==='detail') pageDetail(v);
}
function refreshDatalists(){
  const set=(id,arr)=>{ const el=$('#'+id); if(el) el.innerHTML = arr.map(v=>'<option value="'+esc(v)+'"></option>').join(''); };
  set('dl_vendors', DB.master.vendors.map(v=>v.name));
  set('dl_people',  DB.master.people.map(v=>v.name));
  set('dl_positions', DB.master.positions.map(v=>v.name));
  set('dl_orgs', DB.master.orgs.map(v=>v.name));
  set('dl_gl', DB.master.gl.map(v=>v.code+(v.name?' - '+v.name:'')).map(s=>s.split(' - ')[0]));
  set('dl_cc', DB.master.costCenters.map(v=>v.code));
  set('dl_wbs', DB.master.wbs.map(v=>v.code));
  set('dl_units', DB.master.units.map(v=>v.name));
  set('dl_places', DB.master.places.map(v=>v.name));
  set('dl_methods', PROC_METHODS);
}

/* =========================================================
   6) CHARTS (canvas ล้วน ไม่พึ่งไลบรารีภายนอก)
   ========================================================= */
const PALETTE = ['#16324F','#0E7C66','#1D5FA8','#A15C00','#B3261E','#5B4B8A','#2B7A78','#8A94A2'];
function prep(cv,h){
  const dpr = window.devicePixelRatio||1;
  const w = cv.clientWidth||600;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  cv.style.height = h+'px';
  const c = cv.getContext('2d');
  c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
  c.font = '12px Sarabun, Tahoma, sans-serif';
  return {c:c,w:w,h:h};
}
function niceMax(v){
  if(v<=0) return 10;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const r = v/p;
  const m = r<=1?1:r<=2?2:r<=2.5?2.5:r<=5?5:10;
  return m*p;
}
function fmtAxis(v,isMoney){
  if(!isMoney) return String(Math.round(v));
  if(v>=1000000) return (v/1000000).toFixed(v%1000000?1:0)+' ล.';
  if(v>=1000) return (v/1000).toFixed(0)+' พ.';
  return String(Math.round(v));
}
function drawEmpty(cv,msg){
  const {c,w,h}=prep(cv,220);
  c.fillStyle='#8A94A2'; c.textAlign='center';
  c.fillText(msg||'ไม่มีข้อมูลตามตัวกรองที่เลือก', w/2, h/2);
}
function barChart(cv, items, isMoney){
  items = items.filter(x=>x);
  if(!items.length || items.every(x=>!x.value)) return drawEmpty(cv);
  const H=260, pad={t:18,r:14,b:54,l:52};
  const {c,w,h}=prep(cv,H);
  const max = niceMax(Math.max.apply(null, items.map(i=>i.value)));
  const pw = w-pad.l-pad.r, ph = h-pad.t-pad.b;
  c.strokeStyle='#E7EBF0'; c.fillStyle='#8A94A2'; c.textAlign='right'; c.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y = pad.t+ph-(ph*i/4);
    c.beginPath(); c.moveTo(pad.l,y+.5); c.lineTo(w-pad.r,y+.5); c.stroke();
    c.fillText(fmtAxis(max*i/4,isMoney), pad.l-8, y+4);
  }
  const bw = Math.min(64, pw/items.length*0.55);
  items.forEach((it,i)=>{
    const cx = pad.l + pw*(i+0.5)/items.length;
    const bh = max? ph*it.value/max : 0;
    c.fillStyle = it.color||PALETTE[i%PALETTE.length];
    const y = pad.t+ph-bh;
    c.beginPath();
    const r=4, x=cx-bw/2;
    c.moveTo(x,pad.t+ph); c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y);
    c.lineTo(x+bw-r,y); c.quadraticCurveTo(x+bw,y,x+bw,y+r); c.lineTo(x+bw,pad.t+ph); c.closePath(); c.fill();
    c.fillStyle='#1B2631'; c.textAlign='center';
    c.fillText(isMoney?money0(it.value):String(it.value), cx, y-6);
    c.fillStyle='#55606E';
    wrapText(c, it.label, cx, pad.t+ph+16, bw+28, 13, 2);
  });
}
function wrapText(c,text,x,y,maxW,lh,maxLines){
  const words = String(text).split(/\s+/); let line='', lines=[];
  words.forEach(wd=>{
    const t = line? line+' '+wd : wd;
    if(c.measureText(t).width>maxW && line){ lines.push(line); line=wd; } else line=t;
  });
  if(line) lines.push(line);
  lines = lines.slice(0,maxLines||2);
  lines.forEach((l,i)=> c.fillText(l, x, y+i*lh));
}
function donutChart(cv, items){
  items = items.filter(i=>i.value>0);
  if(!items.length) return drawEmpty(cv);
  const H=260; const {c,w,h}=prep(cv,H);
  const total = items.reduce((s,i)=>s+i.value,0);
  const cx = Math.min(140, w*0.3), cy = h/2, R = Math.min(h/2-18, 92), r = R*0.58;
  let a = -Math.PI/2;
  items.forEach((it,i)=>{
    const ang = total? it.value/total*Math.PI*2 : 0;
    c.beginPath(); c.moveTo(cx,cy); c.arc(cx,cy,R,a,a+ang); c.closePath();
    c.fillStyle = it.color||PALETTE[i%PALETTE.length]; c.fill();
    a+=ang;
  });
  c.globalCompositeOperation='destination-out';
  c.beginPath(); c.arc(cx,cy,r,0,Math.PI*2); c.fill();
  c.globalCompositeOperation='source-over';
  c.fillStyle='#1B2631'; c.textAlign='center'; c.font='bold 15px Sarabun, Tahoma, sans-serif';
  c.fillText(money0(total), cx, cy+2);
  c.font='11px Sarabun, Tahoma, sans-serif'; c.fillStyle='#8A94A2'; c.fillText('บาท', cx, cy+17);
  c.font='12.5px Sarabun, Tahoma, sans-serif'; c.textAlign='left';
  const lx = cx+R+26; let ly = cy - (items.length*21)/2 + 8;
  items.forEach((it,i)=>{
    c.fillStyle = it.color||PALETTE[i%PALETTE.length];
    c.fillRect(lx,ly-9,11,11);
    c.fillStyle='#1B2631';
    const pct = total? Math.round(it.value/total*100):0;
    let label = it.label+'  '+money0(it.value)+' ('+pct+'%)';
    while(c.measureText(label).width > w-lx-12 && label.length>8) label = label.slice(0,-2);
    c.fillText(label, lx+17, ly);
    ly+=21;
  });
}
function lineChart(cv, labels, values, isMoney){
  if(!values.length || values.every(v=>!v)) return drawEmpty(cv);
  const H=260, pad={t:18,r:16,b:40,l:56};
  const {c,w,h}=prep(cv,H);
  const max = niceMax(Math.max.apply(null,values));
  const pw=w-pad.l-pad.r, ph=h-pad.t-pad.b;
  c.strokeStyle='#E7EBF0'; c.fillStyle='#8A94A2'; c.textAlign='right';
  for(let i=0;i<=4;i++){
    const y=pad.t+ph-(ph*i/4);
    c.beginPath(); c.moveTo(pad.l,y+.5); c.lineTo(w-pad.r,y+.5); c.stroke();
    c.fillText(fmtAxis(max*i/4,isMoney), pad.l-8, y+4);
  }
  const X = i => pad.l + (values.length>1? pw*i/(values.length-1) : pw/2);
  const Y = v => pad.t+ph - (max? ph*v/max : 0);
  c.beginPath();
  values.forEach((v,i)=> i? c.lineTo(X(i),Y(v)) : c.moveTo(X(i),Y(v)));
  c.lineTo(X(values.length-1), pad.t+ph); c.lineTo(X(0), pad.t+ph); c.closePath();
  c.fillStyle='rgba(29,95,168,.10)'; c.fill();
  c.beginPath();
  values.forEach((v,i)=> i? c.lineTo(X(i),Y(v)) : c.moveTo(X(i),Y(v)));
  c.strokeStyle='#1D5FA8'; c.lineWidth=2.2; c.stroke();
  values.forEach((v,i)=>{
    c.beginPath(); c.arc(X(i),Y(v),3.6,0,Math.PI*2);
    c.fillStyle='#fff'; c.fill(); c.strokeStyle='#1D5FA8'; c.lineWidth=2; c.stroke();
  });
  c.fillStyle='#55606E'; c.textAlign='center';
  labels.forEach((l,i)=>{ if(labels.length<=14 || i%2===0) c.fillText(l, X(i), pad.t+ph+18); });
}

let dashFilter = {fy:'', month:'', type:'', source:'', vendor:'', status:''};

function applyFilter(list, f){
  return list.filter(p=>{
    if(f.fy && String(p.fiscalYear)!==String(f.fy)) return false;
    if(f.month){
      const m = p.startDate? (new Date(p.startDate+'T00:00:00').getMonth()+1) : 0;
      if(String(m)!==String(f.month)) return false;
    }
    if(f.type && p.typeKey!==f.type) return false;
    if(f.source && (p.budget.sourceKey||'')!==f.source) return false;
    if(f.vendor && (p.vendor.name||'')!==f.vendor) return false;
    if(f.status){
      if(['none','doing','done'].indexOf(f.status)>=0){ if(projectStatus(p)!==f.status) return false; }
      else if(currentStep(p).key!==f.status) return false;
    }
    return true;
  });
}
function allFY(){
  const s = new Set(DB.projects.map(p=>String(p.fiscalYear||'')).filter(Boolean));
  s.add(String(currentFiscalYear()));
  return Array.from(s).sort();
}
function selOpts(arr, val, blank){
  return '<option value="">'+esc(blank||'ทั้งหมด')+'</option>'+
    arr.map(o=>'<option value="'+esc(o.v)+'"'+(String(val)===String(o.v)?' selected':'')+'>'+esc(o.l)+'</option>').join('');
}

        '<td><span class="link" data-open="'+p.id+'">'+esc(p.name)+'</span></td>'+
        '<td>'+esc(typeOf(p.typeKey).label)+'</td>'+
        '<td>'+esc(p.vendor.name||'-')+'</td>'+
        '<td>'+esc(sourceOf(p.budget.sourceKey).label)+'</td>'+
        '<td class="t-right">'+money(t.grand)+'</td>'+

        '<td>'+(st==='done'?'ปิดงานแล้ว':esc(cs.short))+'</td>'+
        '<td><span class="badge '+STATUS[st].cls+'">'+STATUS[st].label+'</span></td></tr>';
    }).join('')+'</tbody></table>';
}
function bindProjectTable(scope){
  $$('[data-open]', scope).forEach(el=> el.onclick=()=> go('detail', el.dataset.open));
}

/* =========================================================
   9) รายการงานทั้งหมด / งานที่ต้องติดตาม
   ========================================================= */
let listState = {q:'', type:'', source:'', status:'', fy:'', sort:'startDate_desc'};
function pageList(v){
  const s = listState;
  let list = applyFilter(DB.projects, {fy:s.fy, month:'', type:s.type, source:s.source, vendor:'', status:s.status});
  if(s.q.trim()){
    const q = s.q.trim().toLowerCase();
    list = list.filter(p=> [p.code,p.name,p.vendor.name,p.description,p.owner,p.area]
      .concat((p.items||[]).map(i=>i.name)).join(' ').toLowerCase().indexOf(q)>=0);
  }
  const [sk,sd] = s.sort.split('_');
  list.sort((a,b)=>{
    let x,y;
    if(sk==='value'){ x=calcTotals(a).grand; y=calcTotals(b).grand; }
    else if(sk==='name'){ x=a.name||''; y=b.name||''; return sd==='asc'? x.localeCompare(y,'th') : y.localeCompare(x,'th'); }

    else { x=a.startDate||''; y=b.startDate||''; return sd==='asc'? x.localeCompare(y) : y.localeCompare(x); }
    return sd==='asc'? x-y : y-x;
  });

let formState = {project:null, isNew:true};

function setPath(obj,path,val){
  const ks=path.split('.'); let o=obj;
  for(let i=0;i<ks.length-1;i++){ if(o[ks[i]]==null||typeof o[ks[i]]!=='object') o[ks[i]]={}; o=o[ks[i]]; }
  o[ks[ks.length-1]]=val;
}
function getPath(obj,path){
  return path.split('.').reduce((o,k)=> (o==null?undefined:o[k]), obj);
}
function field(label, path, type, opts){
  opts=opts||{};
  if(type==='checkbox'){
    const val = opts.value!=null? opts.value : !!getPath(formState.project,path);
    return '<label class="f" style="display:flex;flex-direction:row;align-items:center;gap:8px;'+
      (opts.full?'grid-column:1/-1;':'')+'">'+
      '<input type="checkbox" data-bind="'+path+'" data-checkbox="1"'+(val?' checked':'')+'>'+
      '<span style="font-size:14px">'+esc(label)+'</span></label>';
  }
  const val = opts.value!=null? opts.value : (getPath(formState.project,path)||'');
  const listAttr = opts.list? ' list="'+opts.list+'"' : '';
  let input;
  if(type==='textarea') input = '<textarea data-bind="'+path+'"'+(opts.ph?' placeholder="'+esc(opts.ph)+'"':'')+'>'+esc(val)+'</textarea>';
  else if(type==='select') input = '<select data-bind="'+path+'">'+
      '<option value="">— เลือก —</option>'+
      (opts.options||[]).map(o=>'<option'+(String(val)===String(o)?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
  else if(type==='money'||type==='number') input = '<input type="number" step="any" class="num" data-bind="'+path+'" value="'+esc(val)+'">';
  else input = '<input type="'+(type==='date'?'date':'text')+'" data-bind="'+path+'"'+listAttr+' value="'+esc(val)+'"'+(opts.ph?' placeholder="'+esc(opts.ph)+'"':'')+(opts.readonly?' readonly':'')+'>';
  return '<label class="f"'+(opts.full?' style="grid-column:1/-1"':'')+'><span>'+esc(label)+(opts.req?' <i>*</i>':'')+'</span>'+input+
    (opts.hint?'<span class="hint">'+esc(opts.hint)+'</span>':'')+'</label>';
}

function saveForm(v){
  const p=formState.project;
  collectForm();
  if(!p.name || !p.name.trim()){ toast('กรุณากรอกชื่องานก่อนบันทึก','err'); const el=$('[data-bind="name"]'); if(el){el.focus();} return; }
  p.items = p.items.filter(it=> (it.name&&it.name.trim()) || num(it.qty) || num(it.unitPrice));
  if(!p.items.length) p.items=[{id:uid('it'),name:'',detail:'',qty:0,unit:'',unitPrice:0,gl:'',costCenter:'',wbs:'',materialCode:'',note:''}];
  p.committee = p.committee.filter(c=> c.name && c.name.trim());
  p.ownerDepartment = OWNER_DEPARTMENTS.includes(p.ownerDepartment) ? p.ownerDepartment : 'ผอส.กสฟ.ฉ.2';
  /* หน่วยงานเจ้าของเรื่องเป็น source of truth ของช่อง “จาก” ในเอกสาร
     แยกจากผู้ลงนาม/ผู้มีอำนาจ เพื่อรองรับการเปลี่ยนผู้ลงนามในอนาคต */
  if(p.workflow && p.workflow.s1){
    p.workflow.s1.data = p.workflow.s1.data || {};
    p.workflow.s1.data.docFrom = p.ownerDepartment;
    p.workflow.s1.data.docPrefix = ownerDocPrefix(p);
    p.workflow.s1.data.prefix = ownerDocPrefix(p);
  }
  p.updatedAt = new Date().toISOString();
  if(formState.isNew){
    p.code = nextCode(p.typeKey, p.fiscalYear);
    DB.projects.push(p);
  }else{
    const i = DB.projects.findIndex(x=>x.id===p.id);
    if(i>=0) DB.projects[i]=p; else DB.projects.push(p);
  }
  learnMasterFromProject(p);
  if(saveDB()){ toast('บันทึกข้อมูลเรียบร้อยแล้ว'); formState={project:null,isNew:true}; go('detail', p.id); }
}
/* เก็บข้อมูลที่พิมพ์ใหม่เข้า Master Data อัตโนมัติ เพื่อลดการกรอกซ้ำในครั้งถัดไป */
function learnMasterFromProject(p){
  const add=(key, obj, matchKey)=>{
    const arr=DB.master[key]; const val=(obj[matchKey]||'').trim();
    if(!val) return;
    if(arr.some(x=> String(x[matchKey]||'').trim()===val)) return;
    arr.push(Object.assign({id:uid('m')},obj));
  };
  if(p.vendor.name) add('vendors',{name:p.vendor.name,branchType:p.vendor.branchType||'',taxId:p.vendor.taxId||'',phone:p.vendor.phone||'',email:p.vendor.email||'',address:p.vendor.address||''},'name');
  if(p.officer.name) add('people',{name:p.officer.name,position:p.officer.position||'',org:p.officer.org||''},'name');
  if(p.owner) add('people',{name:p.owner,position:'',org:''},'name');
  (p.committee||[]).forEach(c=>{ if(c.name) add('committees',{name:c.name,position:c.position||'',org:c.org||'',role:c.role||''},'name'); });
  (p.items||[]).forEach(it=>{
    if(it.unit) add('units',{name:it.unit},'name');
    if(it.gl) add('gl',{code:it.gl,name:''},'code');
    if(it.costCenter) add('costCenters',{code:it.costCenter,name:''},'code');
    if(it.wbs) add('wbs',{code:it.wbs,name:''},'code');
  });
  if(p.delivery.place) add('places',{name:p.delivery.place,address:''},'name');
  const bd=p.budget.data||{};
  if(bd.gl) add('gl',{code:bd.gl,name:''},'code');
  if(bd.costCenter) add('costCenters',{code:bd.costCenter,name:''},'code');
  if(bd.wbs) add('wbs',{code:bd.wbs,name:''},'code');
}

function renderTimeline(p){
  const el=$('#tl');
  el.innerHTML = STEPS.map((s,i)=>{
    const w=p.workflow[s.key];
    const cls = w.status==='done'?'done':(w.status==='doing'?'doing':'');
    const mark = w.status==='done'?'✓':(w.status==='doing'?'●':(i+1));
    const meta=[];
    if(w.startDate) meta.push('เริ่ม '+fmtDate(w.startDate));
    if(w.endDate) meta.push('เสร็จ '+fmtDate(w.endDate));
    if(w.docNo) meta.push('เลขที่ '+w.docNo);
    return '<div class="tl-step '+cls+'" data-step="'+s.key+'">'+
      '<div class="tl-rail"><div class="tl-dot">'+mark+'</div>'+(i<STEPS.length-1?'<div class="tl-line"></div>':'')+'</div>'+
      '<div class="tl-body"><div class="n">'+esc(s.name)+' '+
        '<span class="badge '+STATUS[w.status].cls+'" style="margin-left:6px">'+STATUS[w.status].label+'</span></div>'+
        '<div class="meta">'+(meta.length? esc(meta.join('  •  ')) : 'ยังไม่มีข้อมูล — กดเพื่อบันทึก')+'</div>'+
        (w.note? '<div class="meta">หมายเหตุ: '+esc(w.note)+'</div>':'')+
        (s.hasDoc? '<div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
          '<button class="btn sm primary" data-docprev="1">📄 ดูตัวอย่างเอกสาร</button>'+
          '<span class="hint">สั่งพิมพ์หรือบันทึก PDF ได้จากหน้าตัวอย่าง</span></div>':'')+
        (s.hasDoc2? '<div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+

          '<span class="hint">สั่งพิมพ์หรือบันทึก PDF ได้จากหน้าตัวอย่าง</span></div>':'')+

          $$('#imgList [data-rm]').forEach(b=> b.onclick=()=>{ d.images.splice(+b.dataset.rm,1); draw(); });
        };

          const files = Array.prototype.slice.call(e.target.files);

          files.forEach(f=> shrinkImage(f, url=>{ d.images.push(url); if(--left<=0){ draw(); toast('เพิ่มรูปแล้ว'); } }));
          e.target.value='';
        };

function shrinkImage(file, cb){
  const fr=new FileReader();
  fr.onload = ()=>{
    const img=new Image();
    img.onload=()=>{
      const max=900, sc=Math.min(1, max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      cb(cv.toDataURL('image/jpeg',0.72));
    };
    img.onerror=()=>cb(fr.result);
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

let masterTab = MASTERS[0].key;

      '<button class="chip '+(x.key===masterTab?'on':'')+'" data-tab="'+x.key+'">'+esc(x.label)+
      ' <span style="opacity:.65">'+(DB.master[x.key]||[]).length+'</span></button>').join('')+'</div>'+
    '<div class="card"><div class="hd"><h3>'+esc(m.label)+'</h3><div class="spacer"></div>'+
      '<button class="btn primary sm" id="mAdd">＋ เพิ่มข้อมูล</button></div>'+
      (rows.length? '<div class="tbl-wrap"><table><thead><tr>'+
        m.fields.map(f=>'<th>'+esc(f.label)+'</th>').join('')+'<th style="width:150px"></th></tr></thead><tbody>'+
        rows.map((r,i)=>'<tr>'+m.fields.map(f=>'<td>'+esc(r[f.k]||'')+'</td>').join('')+
          '<td class="t-right" style="white-space:nowrap"><button class="btn sm" data-edit="'+i+'">แก้ไข</button> '+
          '<button class="btn sm ghost-danger" data-del="'+i+'">ลบ</button></td></tr>').join('')+
        '</tbody></table></div>'
        : '<div class="empty"><b>ยังไม่มีข้อมูลในหมวดนี้</b>กด “เพิ่มข้อมูล” เพื่อเริ่มต้น</div>')+
    '</div>';
  $$('[data-tab]',v).forEach(b=> b.onclick=()=>{ masterTab=b.dataset.tab; pageMaster(v); });
  $('#mAdd').onclick = ()=> masterEdit(m, null, v);
  $$('[data-edit]',v).forEach(b=> b.onclick=()=> masterEdit(m, +b.dataset.edit, v));
  $$('[data-del]',v).forEach(b=> b.onclick=async()=>{
    const r = rows[+b.dataset.del];

      rows.splice(+b.dataset.del,1); saveDB(); toast('ลบข้อมูลเรียบร้อยแล้ว'); pageMaster(v);
    }
  });
}
function masterEdit(m, idx, v){
  const rows = DB.master[m.key];
  const rec = idx==null? {} : rows[idx];
  openModal({
    title:(idx==null?'เพิ่ม':'แก้ไข')+' '+m.label,
    okLabel:'บันทึก',
    body:'<div class="cols c2">'+m.fields.map(f=>{
      const val=rec[f.k]||'';
      if(f.type==='textarea') return '<label class="f" style="grid-column:1/-1"><span>'+esc(f.label)+'</span><textarea data-mk="'+f.k+'">'+esc(val)+'</textarea></label>';
      if(f.type==='select') return '<label class="f"><span>'+esc(f.label)+'</span><select data-mk="'+f.k+'"><option value="">— เลือก —</option>'+
        f.options.map(o=>'<option'+(val===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select></label>';
      return '<label class="f"><span>'+esc(f.label)+(f.req?' <i>*</i>':'')+'</span><input type="text" data-mk="'+f.k+'"'+
        (f.list?' list="'+f.list+'"':'')+' value="'+esc(val)+'"></label>';
    }).join('')+'</div>',
    onOk:(body)=>{
      const obj = idx==null? {id:uid('m')} : rec;
      let ok=true;
      $$('[data-mk]',body).forEach(el=>{
        const f=m.fields.find(x=>x.k===el.dataset.mk);
        if(f.req && !el.value.trim()) ok=false;
        obj[el.dataset.mk]=el.value;
      });
      if(!ok){ toast('กรุณากรอกข้อมูลในช่องที่มีเครื่องหมาย *','err'); return false; }
      if(idx==null) rows.push(obj);
      saveDB(); toast('บันทึกข้อมูลเรียบร้อยแล้ว'); pageMaster(v);
    }
  });
}

/* =========================================================
   SUPABASE SAFE MIGRATION — v68
   ย้าย "สำเนา" ข้อมูลเดิมขึ้นฐานข้อมูลกลาง
   ไม่ลบ localStorage และยังไม่สลับระบบหลักไปอ่าน/เขียนจาก Cloud
   ========================================================= */
async function sbRequest(path, opts){
  const c=getCloudCfg();
  if(!c.url || !c.key) throw new Error('ยังไม่ได้บันทึก Project URL / Publishable key');
  opts=opts||{};
  if(!await authRefresh()) throw new Error('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่');
  const headers=Object.assign({
    'apikey':c.key,
    'Authorization':'Bearer '+authGet().access_token,
    'Accept':'application/json'
  },opts.headers||{});
  const res=await fetch(c.url.replace(/\/+$/,'')+'/rest/v1/'+path,Object.assign({},opts,{headers}));
  const text=await res.text();
  let body=text; try{ body=text?JSON.parse(text):null; }catch(e){}
  if(!res.ok){
    const msg=(body&&body.message) ? body.message : String(text||('HTTP '+res.status));
    throw new Error(msg+' [HTTP '+res.status+']');
  }
  return {res,body};
}

/* v69: ตรวจตารางโดยตรงผ่าน REST แทนการอ่าน OpenAPI schema
   เพราะ Publishable key อาจถูกปฏิเสธการอ่าน schema ด้วย HTTP 401 */
const CLOUD_TABLE_COLUMNS={
  procurements:[
    'id','job_code','fiscal_year','job_type','owner_org','title',
    'necessity_reason','status','data','created_at','updated_at'
  ],
  master_data:['id','data_type','value','extra','created_at'],
  reason_templates:[
    'id','job_type','equipment_name','reason_text','use_count',
    'created_at','updated_at'
  ]
};
function directDef(table){
  const p={};
  (CLOUD_TABLE_COLUMNS[table]||[]).forEach(k=>p[k]={});
  return {properties:p,required:[]};
}
function sbProps(def){ return (def&&def.properties)||{}; }
function sbRequired(def){ return (def&&def.required)||[]; }
function firstCol(props, names){ return names.find(n=>Object.prototype.hasOwnProperty.call(props,n))||''; }
function setIf(row,props,names,value){
  const k=firstCol(props,names);
  if(k && value!==undefined) row[k]=value;
  return k;
}
async function checkCloudTable(table){
  try{
    await sbRequest(table+'?select=*&limit=1',{method:'GET'});
    return {ok:true,table};
  }catch(e){
    return {ok:false,table,error:e};
  }
}
function isUuid(v){
  return typeof v==='string' &&
    /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(v);
}
function procurementCloudRow(p,def){
  const props=sbProps(def), row={};

  if(isUuid(p.id)) setIf(row,props,['id'],p.id);

  setIf(row,props,['job_code'],p.code||p.jobCode||p.id||'');
  setIf(row,props,['fiscal_year'],String(p.fiscalYear||p.fiscal_year||''));
  setIf(row,props,['job_type'],p.typeKey||p.jobType||p.type||'');
  setIf(row,props,['owner_org'],p.ownerOrg||p.owner_department||p.owner||'');
  setIf(row,props,['title'],p.name||p.title||'');
  setIf(row,props,['necessity_reason'],p.reason||p.necessityReason||'');
  setIf(row,props,['status'],
    (p.workflow&&p.workflow.s8&&p.workflow.s8.status==='done')?'closed':
    (p.status||'active')
  );

  /* เก็บ object เดิมครบทั้งก้อน เพื่อไม่ให้ข้อมูล STEP/รายงานสูญหาย */
  setIf(row,props,['data'],p);

  setIf(row,props,['created_at'],p.createdAt||new Date().toISOString());
  setIf(row,props,['updated_at'],p.updatedAt||new Date().toISOString());
  return row;
}
function masterCloudRows(def){
  const props=sbProps(def), out=[];
  Object.keys(DB.master||{}).forEach(category=>{
    (DB.master[category]||[]).forEach((item,index)=>{
      const row={};
      setIf(row,props,['data_type'],category);
      const value=(item&&item.name) ? item.name :
                  (item&&item.code) ? item.code :
                  (typeof item==='string' ? item : category+' '+(index+1));
      setIf(row,props,['value'],value);
      setIf(row,props,['extra'],{
        legacy:item,
        legacy_id:item&&item.id ? item.id : category+'-'+index,
        code:item&&item.code ? item.code : '',
        sort_order:index+1
      });
      setIf(row,props,['created_at'],
        item&&item.createdAt ? item.createdAt : new Date().toISOString());
      out.push(row);
    });
  });
  return out;
}
function reasonCloudRows(def){
  const props=sbProps(def);
  return reasonLibrary().map((x,index)=>{
    const row={};
    setIf(row,props,['job_type'],x.typeKey||x.jobType||'');
    setIf(row,props,['equipment_name'],x.equipmentName||'');
    setIf(row,props,['reason_text'],x.reason||x.reasonText||'');
    setIf(row,props,['use_count'],Number(x.useCount)||0);
    setIf(row,props,['created_at'],x.createdAt||new Date().toISOString());
    setIf(row,props,['updated_at'],x.updatedAt||new Date().toISOString());
    return row;
  });
}
function checkRequiredRows(def,rows,table){
  const req=sbRequired(def).filter(k=>!['id','created_at','updated_at'].includes(k));
  const missing=req.filter(k=>rows.some(r=>r[k]===undefined || r[k]===null || r[k]===''));
  if(missing.length) throw new Error('ตาราง '+table+' มีช่องบังคับที่ระบบยังจับคู่ไม่ได้: '+missing.join(', '));
}
async function tableCount(table){
  try{
    const x=await sbRequest(table+'?select=*&limit=1',{
      headers:{'Prefer':'count=exact','Range':'0-0'}
    });
    const cr=x.res.headers.get('content-range')||'';
    const m=cr.match(/\/(\d+)$/); return m?Number(m[1]):null;
  }catch(e){ return null; }
}
async function insertCloudRows(table,rows){
  if(!rows.length) return 0;
  const x=await sbRequest(table,{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Prefer':'return=representation,resolution=ignore-duplicates'
    },
    body:JSON.stringify(rows)
  });
  return Array.isArray(x.body)?x.body.length:rows.length;
}

async function upsertProcurements(rows){
  if(!rows.length) return 0;
  const x=await sbRequest('procurements?on_conflict=job_code',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Prefer':'return=representation,resolution=merge-duplicates'
    },
    body:JSON.stringify(rows)
  });
  return Array.isArray(x.body)?x.body.length:rows.length;
}

async function cloudMigrationPlan(){
  const tables=['procurements','master_data','reason_templates'];
  const checks={};
  for(const t of tables) checks[t]=await checkCloudTable(t);

  if(!checks.procurements.ok)
    throw new Error('ตาราง procurements ยังอ่านไม่ได้: '+(checks.procurements.error.message||checks.procurements.error));

  /* master_data / reason_templates เป็นข้อมูลเสริม:
     ถ้ายังไม่มี policy อ่านได้ จะไม่ขวางการย้าย 4 งานหลัก */
  const defs={
    procurements:directDef('procurements'),
    master_data:checks.master_data.ok?directDef('master_data'):null,
    reason_templates:checks.reason_templates.ok?directDef('reason_templates'):null
  };

  await probeAllCloudWrites(defs);
  const pRows=(DB.projects||[]).map(p=>procurementCloudRow(p,defs.procurements));
  const mRows=defs.master_data ? masterCloudRows(defs.master_data) : [];
  const rRows=defs.reason_templates ? reasonCloudRows(defs.reason_templates) : [];

  return {defs,checks,pRows,mRows,rRows};
}
async function runSafeCloudMigration(onStatus){
  const plan=await cloudMigrationPlan();
  const before={
    procurements:await tableCount('procurements'),
    master_data:plan.defs.master_data?await tableCount('master_data'):null,
    reason_templates:plan.defs.reason_templates?await tableCount('reason_templates'):null
  };
  onStatus('กำลังซิงก์งาน '+plan.pRows.length+' งานขึ้น Supabase (งานเดิมจะอัปเดต ไม่สร้างซ้ำ)...');
  const insertedP=await upsertProcurements(plan.pRows);
  let insertedM=0, insertedR=0;
  if(plan.defs.master_data && plan.mRows.length){
    onStatus('กำลังส่งข้อมูลพื้นฐาน '+plan.mRows.length+' รายการ...');
    insertedM=await insertCloudRows('master_data',plan.mRows);
  }
  if(plan.defs.reason_templates && plan.rRows.length){
    onStatus('กำลังส่งคลังเหตุผล '+plan.rRows.length+' รายการ...');
    insertedR=await insertCloudRows('reason_templates',plan.rRows);
  }
  const after={
    procurements:await tableCount('procurements'),
    master_data:plan.defs.master_data?await tableCount('master_data'):null,
    reason_templates:plan.defs.reason_templates?await tableCount('reason_templates'):null
  };
  localStorage.setItem('procurement_last_cloud_migration_v1',JSON.stringify({
    at:new Date().toISOString(),before,after,localProjects:(DB.projects||[]).length
  }));
  return {before,after,insertedP,insertedM,insertedR,plan};
}

let CLOUD_SYNC_TIMER=null, CLOUD_SYNC_BUSY=false, CLOUD_SYNC_AGAIN=false;

async function syncDBToCloud(){
  if(!cloudConfigured()) return;
  if(CLOUD_SYNC_BUSY){ CLOUD_SYNC_AGAIN=true; return; }
  CLOUD_SYNC_BUSY=true;
  try{
    const rows=(DB.projects||[]).map(p=>procurementCloudRow(p,directDef('procurements')));
    if(rows.length) await upsertProcurements(rows);
    await replaceCloudMaster();
    await replaceCloudReasons();
    localStorage.setItem('procurement_last_cloud_sync_v1',new Date().toISOString());
  }finally{
    CLOUD_SYNC_BUSY=false;
    if(CLOUD_SYNC_AGAIN){ CLOUD_SYNC_AGAIN=false; scheduleCloudSync(); }
  }
}
function cloudProjectFromRow(r){
  const p=(r&&r.data&&typeof r.data==='object') ? r.data : {};
  if(!p.code) p.code=r.job_code||'';
  if(!p.fiscalYear) p.fiscalYear=r.fiscal_year||'';
  if(!p.typeKey) p.typeKey=r.job_type||'';
  if(!p.name) p.name=r.title||'';
  if(!p.reason) p.reason=r.necessity_reason||'';
  normalizeProject(p); return p;
}
async function loadCloudAsPrimary(){
  if(!cloudConfigured()) return false;
  const [pp,mm,rr]=await Promise.all([
    sbRequest('procurements?select=*&order=created_at.asc',{method:'GET'}),
    sbRequest('master_data?select=*&order=created_at.asc',{method:'GET'}),
    sbRequest('reason_templates?select=*&order=created_at.asc',{method:'GET'})
  ]);
  DB.projects=(pp.body||[]).map(cloudProjectFromRow);
  const master={}; MASTERS.forEach(m=>master[m.key]=[]);
  (mm.body||[]).forEach(r=>{
    if(!master[r.data_type]) master[r.data_type]=[];
    const legacy=r.extra&&r.extra.legacy;
    master[r.data_type].push(legacy!==undefined?legacy:{name:r.value||'',id:r.id});
  });
  DB.master=master;
  DB.reasonLibrary=(rr.body||[]).map(r=>({
    id:r.id,typeKey:r.job_type||'',equipmentName:r.equipment_name||'',
    reason:r.reason_text||'',useCount:Number(r.use_count)||0,
    createdAt:r.created_at||'',updatedAt:r.updated_at||''
  }));
  localStorage.setItem(APP.key,JSON.stringify(DB));
  return true;
}
async function startApp(){
  // ห้ามแสดง cache ของผู้ใช้อื่นก่อนยืนยันตัวตน
  DB=emptyDB();authGate();
  if(!cloudConfigured()){authGate('ยังไม่ได้ตั้งค่า Supabase Project URL / Publishable key');return}
  if(await authRefresh()){
    try{await authRoleCheck();await loadCloudAsPrimary();authUngate();render();return}
    catch(e){console.error(e);authStore(null);authGate('ไม่สามารถยืนยันสิทธิ์หรือโหลดข้อมูล: '+e.message);return}
  }
  authGate();
}

/* ---- helper: ตัดคำกริยานำหน้าที่ซ้ำกับ Template ออกจากชื่องาน แล้วต่อกริยา+ชื่องานอย่างเป็นธรรมชาติ ---- */
function normalizeWorkName(name, typeKey){
  name = String(name==null?'':name).trim();
  if(!name) return '';
  const prefixes = (DOC_WORDS[typeKey]||DOC_WORDS.purchase).stripPrefixes||[];
  const sorted = prefixes.slice().sort((a,b)=>b.length-a.length);
  for(let i=0;i<sorted.length;i++){
    const pre = sorted[i];
    if(name.indexOf(pre)===0){ name = name.slice(pre.length).trim(); break; }
  }
  return name;
}
function joinWorkPhrase(prefix, bareName){
  if(!bareName) return prefix;
  const needsSpace = /^[A-Za-z0-9]/.test(bareName);
  return prefix + (needsSpace? ' ' : '') + bareName;
}

  /* ล้างคำที่เป็น template ซึ่งอาจติดมากับข้อมูลเก่า เช่น
     "รายงานขอจัดซื้อ", "รายงานการจัดซื้อ", "จัดซื้อ" ซ้ำหลายชั้น */
  const common=['รายงานขอจัดซื้อ','รายงานการจัดซื้อ','รายงานขอซื้อ',
                'รายงานขอจัดจ้างซ่อม','รายงานการจัดจ้างซ่อม','รายงานขอจ้างซ่อม',
                'รายงานขอจัดจ้าง','รายงานการจัดจ้าง','รายงานขอจ้าง'];
  let changed=true;
  while(changed){
    changed=false;
    for(const pre of common.concat((W.stripPrefixes||[]).slice().sort((a,b)=>b.length-a.length))){
      if(x.indexOf(pre)===0){ x=x.slice(pre.length).trim(); changed=true; break; }
    }
  }
  return x;
}

/* buildBudgetText: สร้างข้อความ "แหล่งงบประมาณ" สำหรับข้อ 4 ของรายงาน จากจุดเดียว
   เพื่อให้ STEP อื่นในอนาคตเรียกใช้ซ้ำได้ โดยไม่ปะปนข้อความระหว่างแหล่งงบ:
   - งบทำการ: ใช้ค่ามาตรฐานระดับหน่วยงาน (ตั้งค่าหน่วยงาน) ทั้งหมด ไม่พึ่งข้อมูลรายโครงการ
   - WBS: แสดงเฉพาะข้อมูล WBS เท่านั้น ไม่ปนข้อความ/ตัวเลขของงบทำการ
   - อื่น ๆ: ใช้รายละเอียดที่ผู้ใช้กรอกเองในโครงการนั้น */
function buildBudgetText(p){
  const o = orgCfg();
  const bd = p.budget.data||{};
  const fy = p.fiscalYear || bd.fiscalYear || currentFiscalYear();
  if(p.budget.sourceKey==='operating'){
    let s = 'งบประมาณทำการปี '+fy+' ของ '+o.budgetOwner+' รหัสบัญชี '+o.operatingGL+
      (o.operatingGLName? ' ('+o.operatingGLName+')':'')+
      ' ศูนย์ต้นทุน '+o.operatingCostCenter;
    if(bd.isKotorKhor){
      // งบทำการตามแนวทาง กทข. — แสดงเลขที่บันทึกอนุมัติแทนข้อความแนวทางทั่วไป ห้ามปนกัน
      s += ' ตามบันทึกเลขที่ '+(bd.budgetApprovalNo||'')+' '+(bd.budgetApprovalSubject||'');
    }else{
      s += ' '+o.budgetGuideline+' (เอกสารแนบ '+o.operatingAttachNo+')';
    }
    return s;
  }
  if(p.budget.sourceKey==='wbs'){
    let s = 'งบประมาณหมายเลขงาน WBS '+(bd.wbs||'');
    if(bd.network) s += ' รหัสโครงข่าย/กิจกรรม '+bd.network;
    if(bd.fundSource) s += ' แหล่งเงิน '+bd.fundSource;
    return s;
  }
  // แหล่งงบ "อื่น ๆ" — ใช้ข้อมูลที่ผู้ใช้กรอกไว้ในโครงการนั้นเท่านั้น
  let s = 'งบประมาณ'+(bd.sourceName||sourceOf(p.budget.sourceKey).label||'อื่น ๆ');
  if(bd.gl) s += ' รหัสบัญชี '+bd.gl;
  if(bd.note) s += ' '+bd.note;
  return s;
}

/* ตรวจข้อมูลจำเป็นเฉพาะกรณีใหม่ก่อนเปิด Preview ของ STEP 1 (งบทำการตามแนวทาง กทข. ต้องมีเลขที่บันทึก)
   ไม่กระทบเงื่อนไข/ตรรกะอื่นของ STEP 1 ที่มีอยู่เดิม */
function validateStep1Doc(p){
  const missing=[];
  const bd = p.budget.data||{};

      body:'<p>กรุณาตรวจสอบข้อมูลต่อไปนี้ก่อนดูตัวอย่างเอกสาร:</p><ul style="margin:8px 0 0 20px;padding:0">'+
        missing.map(m=>'<li style="margin-bottom:4px">'+esc(m)+'</li>').join('')+'</ul>'
    });

function openDocPreview(p){
  const root=$('#printRoot');

  root.innerHTML =
    '<div class="doc-viewer">'+
      '<div class="doc-toolbar">'+
        '<button class="btn" id="docClose2">← กลับไปแก้ไข</button>'+

        '<span class="hint" style="color:#A9C0D6">A4 • '+pageCount+' หน้า</span>'+
        '<span class="sp"></span>'+
        '<span class="hint" style="color:#A9C0D6">ขนาดอักษร</span>'+
        '<button class="btn sm" id="docFsDown">ก−</button>'+
        '<span id="docFsVal" style="min-width:52px;text-align:center">'+docFontSize+' pt</span>'+
        '<button class="btn sm" id="docFsUp">ก+</button>'+
        '<button class="btn primary" id="docPrint">🖨 พิมพ์ / Save PDF</button>'+
      '</div>'+

      docHtml+
    '</div>';
  root.style.display='block';
  document.body.classList.add('has-doc');
  enterDocPreviewHistory();
  $('#docClose2').onclick=closeDocPreview;
  $('#docPrint').onclick=()=>window.print();
  const setFs=v=>{ docFontSize=Math.min(18,Math.max(12,v));
    root.style.setProperty('--docfs', docFontSize+'pt');
    $('#docFsVal').textContent=docFontSize+' pt'; };
  $('#docFsDown').onclick=()=>setFs(docFontSize-0.5);
  $('#docFsUp').onclick=()=>setFs(docFontSize+0.5);
  setFs(docFontSize);
  document.addEventListener('keydown', escDoc);
  root.scrollTop=0;
  // การ์ดกันเนื้อหาล้น: ถ้าหน้าใดสูงเกินขนาด A4 จริง (พบเฉพาะข้อมูลยาวผิดปกติ) แจ้งเตือนใน console
  // เพื่อให้ผู้ดูแลระบบทราบ โดยไม่ไปยุ่งกับ Layout ของ Template (ไม่ตัด ไม่ยุบฟอนต์อัตโนมัติ)
  setTimeout(()=>{
    $$('.sheet-in', root).forEach((el,idx)=>{
      if(el.scrollHeight > el.clientHeight + 2){
        console.warn('เอกสาร STEP 1: หน้า '+(idx+1)+' มีเนื้อหายาวเกินขนาด A4 หนึ่งหน้า ('+el.scrollHeight+'px > '+el.clientHeight+'px)');
      }
    });
  }, 50);
}
let docFontSize = 15; // ค่าตั้งต้นให้พอดี 2 หน้า A4 ตามข้อมูลตัวอย่าง (ปรับเพิ่ม/ลดได้จาก Toolbar)
/* Preview navigation: เปิด Preview เป็น 1 history state เพื่อให้ปุ่ม Back ของ Browser
   กลับไปยังหน้าที่เปิด Preview มา โดยไม่ต้อง Refresh */
let docPreviewHistoryActive = false;
function enterDocPreviewHistory(){
  if(docPreviewHistoryActive) return;
  history.pushState({docPreview:true}, '', location.href);
  docPreviewHistoryActive = true;
}
function escDoc(e){ if(e.key==='Escape') closeDocPreview(); }
function hideDocPreview(){
  const root=$('#printRoot');
  root.innerHTML=''; root.style.display='none';
  document.body.classList.remove('has-doc');
  document.removeEventListener('keydown', escDoc);
  docPreviewHistoryActive = false;
}
function closeDocPreview(){
  /* ถ้า Preview สร้าง history state ไว้ ให้ย้อนกลับจริง 1 ขั้น
     popstate จะเป็นผู้ปิด Preview ทำให้ทั้งปุ่มในหน้าและ Browser Back ทำงานเหมือนกัน */
  if(docPreviewHistoryActive){ history.back(); return; }
  hideDocPreview();
}
window.addEventListener('popstate', ()=>{
  if(document.body.classList.contains('has-doc')) hideDocPreview();
});

/* =========================================================
   14.55) STEP 2 "ต่อรองราคา" — หนังสือขอต่อรองราคา
   ฟังก์ชันนี้ทั้งหมดแยกจาก STEP 1 โดยเจตนา (step2DocHTML, openDocPreview2)
   ไม่แก้ step1DocHTML/openDocPreview/ensureDocDefaults ของเดิมแม้แต่บรรทัดเดียว
   ========================================================= */
/* ที่อยู่ผู้ส่งของหนังสือต่อรอง — ข้อความคงที่ตามต้นฉบับ ไม่ดึงจาก Vendor/Org Settings
   และไม่เปลี่ยนตาม Project ตามที่ระบุไว้อย่างชัดเจน */
const NEGO_ADDRESS_LINES = [
  'การไฟฟ้าส่วนภูมิภาคเขต 2',
  '(ภาคตะวันออกเฉียงเหนือ) จังหวัดอุบลราชธานี',
  '195 หมู่ 7 ถนนเลี่ยงเมือง',
  'ตำบลแจระแม อำเภอเมือง จังหวัดอุบลราชธานี 34000'
];
/* เลขที่หนังสือต่อรอง: "ที่ มท 5306." + เลข 2 หลักท้ายของปี พ.ศ. + "/" (เว้นว่างหลัง / เสมอ
   เลขเดินหนังสือออกและกรอกด้วยมือภายหลัง ไม่ใช่ค่าที่ระบบสร้างให้) */
function negoDocNoText(year){
  const y = String(parseInt(year,10)||currentFiscalYear());
  const yy = y.length>=2? y.slice(-2) : y.padStart(2,'0');
  return 'ที่ มท 5306.'+yy+'/';
}
/* เติมค่าตั้งต้นของหนังสือต่อรองจากข้อมูลงาน (ปี พ.ศ. จาก Project.fiscalYear, คำขึ้นต้นมาตรฐาน)
   ไม่แตะ negoNo/negoDate เดิม และไม่เติมเดือน/วันที่ปัจจุบันให้โดยอัตโนมัติ */
function ensureNegoDefaults(p){
  const w = p.workflow.s2; const d = w.data||(w.data={});
  const set=(k,v)=>{ if(d[k]===undefined||d[k]===null||d[k]==='') d[k]=v; };
  set('negoYear', p.fiscalYear||currentFiscalYear());
  set('attnPrefix','กรรมการ ผู้จัดการ');
  // ชื่อ/ตำแหน่งผู้ลงนามในหนังสือฉบับนี้ — ค่าเริ่มต้นเท่านั้น (ใช้ set() จึงไม่ทับค่าที่ผู้ใช้แก้เองแล้ว)
  // เติมจาก p.officer ก่อน และถ้าเคยบันทึกตำแหน่งเต็มไว้กับบุคคลนี้ใน DB.master.people ให้ใช้ค่านั้นแทน
  set('signerName', p.officer.name||'');
  const person = (DB.master.people||[]).find(x=>x.name===p.officer.name);
  set('fullPosition', (person&&person.fullPosition) || p.officer.position || '');
  return d;
}
/* จำ "ตำแหน่งเต็มสำหรับใช้ในหนังสือ" ไว้กับบุคคลใน Master Data (DB.master.people/positions)
   เรียกเฉพาะเมื่อผู้ใช้ติ๊กเลือก "บันทึกตำแหน่งนี้ไว้ใช้ครั้งต่อไป" เท่านั้น (ไม่บันทึกอัตโนมัติ)
   ใช้ saveDB() เดิม ไม่สร้าง localStorage key ใหม่ */
function learnFullPositionFromNego(p){
  const d = p.workflow.s2.data||{};
  const fp = (d.fullPosition||'').trim();
  const name = (d.signerName||p.officer.name||'').trim();
  if(!fp || !name) return;
  let person = DB.master.people.find(x=>x.name===name);
  if(person) person.fullPosition = fp;
  else DB.master.people.push({id:uid('p'), name:name, position:p.officer.position||'', org:p.officer.org||'', fullPosition:fp});
  if(!DB.master.positions.some(x=>x.name===fp)) DB.master.positions.push({id:uid('ps'), name:fp});
}
/* ตรวจข้อมูลจำเป็นก่อนเปิด Preview ของหนังสือต่อรอง คืนค่าเป็นรายการหัวข้อที่ยังขาด (ว่าง = พร้อม) */
function validateStep2Doc(p){
  const d = ensureNegoDefaults(p);
  const missing=[];
  if(!p.vendor.name) missing.push('ชื่อบริษัท/ผู้ยื่นข้อเสนอ (Section C ข้อมูลบริษัท)');
  if(!p.vendor.quoteNo) missing.push('เลขที่ใบเสนอราคา (Section C ข้อมูลบริษัท)');
  if(!(p.items&&p.items.length)) missing.push('รายการพัสดุ/งาน อย่างน้อย 1 รายการ');
  if(!d.negoMonth) missing.push('เดือนที่ออกหนังสือต่อรอง (ในขั้นตอน "ต่อรองราคา")');
  if(!d.negoYear) missing.push('ปี พ.ศ. ของหนังสือต่อรอง (ในขั้นตอน "ต่อรองราคา")');
  if(!d.replyDue) missing.push('วันที่ให้บริษัทตอบกลับ (ในขั้นตอน "ต่อรองราคา")');
  if(!(d.signerName||p.officer.name)) missing.push('ชื่อผู้ลงนามในหนังสือ (ในขั้นตอน "ต่อรองราคา" หรือ Section F เจ้าหน้าที่พัสดุ)');
  if(!d.fullPosition) missing.push('ตำแหน่งเต็มสำหรับใช้ในหนังสือ (ในขั้นตอน "ต่อรองราคา")');
  return missing;
}

  root.innerHTML =
    '<div class="doc-viewer">'+
      '<div class="doc-toolbar">'+
        '<button class="btn" id="docClose2">← กลับไปแก้ไข</button>'+
        '<b>ตัวอย่างเอกสาร หนังสือขอต่อรองราคา — '+esc(p.code)+'</b>'+
        '<span class="hint" style="color:#A9C0D6">A4 • '+pageCount+' หน้า</span>'+
        '<span class="sp"></span>'+
        '<span class="hint" style="color:#A9C0D6">ขนาดอักษร</span>'+
        '<button class="btn sm" id="docFsDown">ก−</button>'+
        '<span id="docFsVal" style="min-width:52px;text-align:center">'+docFontSize+' pt</span>'+
        '<button class="btn sm" id="docFsUp">ก+</button>'+
        '<button class="btn primary" id="docPrint">🖨 พิมพ์ / Save PDF</button>'+
      '</div>'+
      '<div class="doc-hint">ภาพเสมือนจริงของกระดาษ A4 ทุกหน้า ใช้ Template เดียวกับตอนสั่งพิมพ์ — เลื่อนดูได้ครบทุกแผ่นก่อนสั่งพิมพ์</div>'+
      docHtml+
    '</div>';
  root.style.display='block';
  document.body.classList.add('has-doc');
  enterDocPreviewHistory();
  $('#docClose2').onclick=closeDocPreview;
  $('#docPrint').onclick=()=>window.print();
  const setFs=v=>{ docFontSize=Math.min(18,Math.max(12,v));
    root.style.setProperty('--docfs', docFontSize+'pt');
    $('#docFsVal').textContent=docFontSize+' pt'; };
  $('#docFsDown').onclick=()=>setFs(docFontSize-0.5);
  $('#docFsUp').onclick=()=>setFs(docFontSize+0.5);
  setFs(docFontSize);
  document.addEventListener('keydown', escDoc);
  root.scrollTop=0;
  setTimeout(()=>{
    $$('.sheet-in', root).forEach((el,idx)=>{
      if(el.scrollHeight > el.clientHeight + 2){
        console.warn('หนังสือต่อรองราคา: หน้า '+(idx+1)+' มีเนื้อหายาวเกินขนาด A4 หนึ่งหน้า ('+el.scrollHeight+'px > '+el.clientHeight+'px)');
      }
    });
  }, 50);
}

/* =========================================================
   14.65) STEP 3 "รายงานผลการพิจารณา / ขออนุมัติ"
   ฟังก์ชันทั้งหมดแยกจาก STEP 1/STEP 2 โดยเจตนา (step3DocHTML, openDocPreview3)
   ไม่แก้ step1DocHTML/step2DocHTML/openDocPreview/openDocPreview2/ensureDocDefaults/
   ensureNegoDefaults ของเดิมแม้แต่บรรทัดเดียว
   ========================================================= */
/* เติมค่าตั้งต้นของผู้ลงนามในรายงานผลฯ จากข้อมูลงาน (ไม่แก้ p.officer อัตโนมัติ) */
function ensureStep3Defaults(p){
  const w = p.workflow.s3; const d = w.data||(w.data={});
  const set=(k,v)=>{ if(d[k]===undefined||d[k]===null||d[k]==='') d[k]=v; };
  const person = (DB.master.people||[]).find(x=>x.name===p.officer.name);
  set('signerName', p.officer.name||'');
  set('fullPosition', (person&&person.fullPosition) || p.officer.position || '');
  return d;
}
/* จำ "ตำแหน่งเต็ม" ของผู้ลงนามรายงานผลฯ ไว้กับ Master Data — เรียกเฉพาะเมื่อผู้ใช้ติ๊กเลือก
   "บันทึกตำแหน่งนี้ไว้ใช้ครั้งต่อไป" เท่านั้น (ไม่บันทึกอัตโนมัติ) ใช้ saveDB() เดิม */
function learnFullPositionFromStep3(p){
  const d = p.workflow.s3.data||{};
  const fp = (d.fullPosition||'').trim();
  const name = (d.signerName||p.officer.name||'').trim();
  if(!fp || !name) return;
  let person = DB.master.people.find(x=>x.name===name);
  if(person) person.fullPosition = fp;
  else DB.master.people.push({id:uid('p'), name:name, position:p.officer.position||'', org:p.officer.org||'', fullPosition:fp});
  if(!DB.master.positions.some(x=>x.name===fp)) DB.master.positions.push({id:uid('ps'), name:fp});
}
/* คำนวณราคาที่ตกลงซื้อจริงจากผลการต่อรองใน STEP 2 (Source of Truth) — ไม่ใช้ VAT/ยอดรวมเดิม
   ของ STEP 1 ซ้ำ คำนวณใหม่จากราคาที่ตกลงเสมอ รองรับทุกค่าที่เป็นไปได้ของ s2.result:
   - "ยืนราคาเดิม" หรือไม่มีผล -> ใช้ calcTotals(p).sub เดิม
   - "ลดราคาให้" -> ใช้ priceAfter (ต้องมีค่า มิฉะนั้นถือว่าไม่พร้อม)
   - "ขอเสนอราคาใหม่" -> ต้องมี priceAfter ชัดเจนเช่นกัน ห้ามเดาราคาเอง
   - "อยู่ระหว่างรอผล" หรือไม่มีผลเลย -> ไม่พร้อม (sub=null) ต้องให้ผู้ใช้บันทึกผลใน STEP 2 ก่อน */
function computeStep3Pricing(p){
  const s2 = (p.workflow.s2 && p.workflow.s2.data) || {};
  const original = calcTotals(p).sub;
  const rate = num(p.vatRate);
  const resultKind = s2.result || '';
  let sub;
  if(resultKind==='ลดราคาให้'){
    sub = (s2.priceAfter!=null && s2.priceAfter!=='')? num(s2.priceAfter) : null;
  }else if(resultKind==='ขอเสนอราคาใหม่'){
    sub = (s2.priceAfter!=null && s2.priceAfter!=='')? num(s2.priceAfter) : null;
  }else if(resultKind==='ยืนราคาเดิม'){
    sub = original;
  }else{
    // ไม่มีผลต่อรอง หรือ "อยู่ระหว่างรอผล" — ลองใช้ agreedPrice เดิม (backward compat) ก่อนจึงถือว่ายังไม่พร้อม
    const legacy = (p.workflow.s3&&p.workflow.s3.data&&p.workflow.s3.data.agreedPrice);
    sub = (legacy!=null && legacy!=='')? num(legacy) : null;
  }
  const vat = sub==null? null : Math.round(sub*rate)/100;
  const grand = sub==null? null : Math.round((sub+vat)*100)/100;
  return {sub:sub, vat:vat, grand:grand, rate:rate, resultKind:resultKind, original:original};
}
/* ตรวจข้อมูลจำเป็นก่อนเปิด Preview ของรายงานผลฯ คืนค่าเป็นรายการหัวข้อที่ยังขาด (ว่าง = พร้อม) */
function validateStep3Doc(p){
  const missing=[];
  const s1 = (p.workflow.s1 && p.workflow.s1.data) || {};
  const s2 = (p.workflow.s2 && p.workflow.s2.data) || {};
  const d = ensureStep3Defaults(p);
  if(!s1.requestNo) missing.push('เลขที่หนังสือของรายงานขอซื้อ/ขอจ้าง (ในขั้นตอน "รายงานขอซื้อ/ขอจ้าง")');
  if(!s1.requestDate) missing.push('วันที่หนังสือของรายงานขอซื้อ/ขอจ้าง (ในขั้นตอน "รายงานขอซื้อ/ขอจ้าง")');
  if(!p.vendor.name) missing.push('ชื่อบริษัท/ผู้ยื่นข้อเสนอ (Section C ข้อมูลบริษัท)');
  if(!(p.items&&p.items.length)) missing.push('รายการพัสดุ/งาน อย่างน้อย 1 รายการ');
  if(!s2.result){
    missing.push('กรุณาบันทึกผลการต่อรองราคาใน STEP 2 ก่อนจัดทำรายงานผล');
  }else if(s2.result==='อยู่ระหว่างรอผล'){
    missing.push('กรุณาบันทึกผลการต่อรองราคาใน STEP 2 ก่อนจัดทำรายงานผล');
  }else if(s2.result==='ลดราคาให้' && (s2.priceAfter==null || s2.priceAfter==='')){
    missing.push('ราคาหลังต่อรอง (priceAfter) ในขั้นตอน "ต่อรองราคา" เนื่องจากผลคือ "ลดราคาให้"');
  }else if(s2.result==='ขอเสนอราคาใหม่' && (s2.priceAfter==null || s2.priceAfter==='')){
    missing.push('ราคาที่ตกลงใหม่ (priceAfter) ในขั้นตอน "ต่อรองราคา" เนื่องจากผลคือ "ขอเสนอราคาใหม่"');
  }
  if(!p.workflow.s3.data.priceValidUntil) missing.push('วันที่ครบกำหนดยืนราคา (ในขั้นตอน "รายงานผลการพิจารณา")');
  if(!p.delivery.days) missing.push('กำหนดส่งมอบ (Section E การส่งมอบ)');
  if(!p.delivery.place) missing.push('สถานที่ส่งมอบ (Section E การส่งมอบ)');
  if(!(d.signerName||p.officer.name)) missing.push('ชื่อผู้ลงนามในรายงาน (ในขั้นตอน "รายงานผลการพิจารณา" หรือ Section F เจ้าหน้าที่พัสดุ)');
  if(!d.fullPosition) missing.push('ตำแหน่งเต็มสำหรับใช้ในรายงาน (ในขั้นตอน "รายงานผลการพิจารณา")');
  return missing;
}
function tryOpenDocPreview3(p){
  const missing = validateStep3Doc(p);
  if(missing.length){
    openModal({
      title:'ข้อมูลยังไม่ครบสำหรับออกรายงานผลการพิจารณา',
      body:'<p>กรุณาตรวจสอบข้อมูลต่อไปนี้ให้ครบก่อนดูตัวอย่างเอกสาร:</p><ul style="margin:8px 0 0 20px;padding:0">'+
        missing.map(m=>'<li style="margin-bottom:4px">'+esc(m)+'</li>').join('')+'</ul>'
    });
    return;
  }
  openDocPreview3(p);
}

function buildPRHeaderNote(p){
  const o=orgCfg(), bd=(p.budget&&p.budget.data)||{};
  const fy=p.fiscalYear||bd.fiscalYear||currentFiscalYear();
  if(p.budget&&p.budget.sourceKey==='operating'){
    let t='งบทำการ '+o.budgetOwner+' ประจำปี '+fy+' รหัสบัญชี '+o.operatingGL+' ศูนย์ต้นทุน '+o.operatingCostCenter;
    if(bd.isKotorKhor){
      if(bd.budgetApprovalNo) t+=' ตามบันทึกเลขที่ '+bd.budgetApprovalNo;
      if(bd.budgetApprovalSubject) t+=' '+bd.budgetApprovalSubject;
    }else if(bd.note){ t+=' '+bd.note; }
    return t.trim();
  }
  if(p.budget&&p.budget.sourceKey==='wbs'){
    let lead=bd.note||bd.fundSource||'งบตามหมายเลขงาน';
    return (lead+' ตามหมายเลขงาน WBS: '+(bd.wbs||'')).trim();
  }
  return ((bd.sourceName||'งบประมาณอื่น ๆ')+(bd.note?' '+bd.note:'')).trim();
}
function ensureStep4Defaults(p,refreshHeader){
  const d=p.workflow.s4.data||(p.workflow.s4.data={});
  const set=(k,v)=>{ if(d[k]===undefined||d[k]===null||d[k]==='') d[k]=v; };
  set('docType','PR มาตรฐาน (ZNB1)'); set('itemCategory','มาตรฐาน');
  set('acctAssign', p.typeKey==='repair'?'คชจ.เข้าใบสั่งซ่อม/งานบริการ (F)':'คชจ.เข้าหน่วยงาน (K)');
  set('materialGroup','YS0400'); set('receivingPlace',(p.delivery&&p.delivery.place)||'');
  if(refreshHeader || !d.headerNote) d.headerNote=buildPRHeaderNote(p);
  if(!d.prNo && p.workflow.s4.docNo) d.prNo=p.workflow.s4.docNo;
  return d;
}
function prRows(p){
  const d=ensureStep4Defaults(p), bd=(p.budget&&p.budget.data)||{}, o=orgCfg();
  const base=(p.items||[]).map((it,i)=>({
    no:i+1,name:it.name||p.name||'',detail:it.detail||'',qty:num(it.qty)||0,unit:it.unit||'',unitPrice:num(it.unitPrice),amount:itemAmount(it),
    materialGroup:d.materialGroup||'YS0400', gl:it.gl||(p.budget.sourceKey==='wbs'?bd.gl:o.operatingGL)||'',
    costCenter:it.costCenter||(p.budget.sourceKey==='operating'?o.operatingCostCenter:''),
    wbs:it.wbs||(p.budget.sourceKey==='wbs'?bd.wbs:''), materialCode:it.materialCode||'', network:it.network||bd.network||'', note:it.note||''
  }));
  if(!p.budget || p.budget.sourceKey!=='wbs'){
    const rows=[];
    base.forEach(r=>{
      const q=Math.max(1,Math.round(r.qty||1));
      // งบทำการ/กทข.: แตกตามจำนวนจริงตาม Business Rule ของผู้ใช้
      for(let n=0;n<q;n++) rows.push(Object.assign({},r,{qty:1,amount:r.unitPrice,no:rows.length+1}));
    });
    return rows;
  }
  // WBS: รวมเป็นกลุ่มก้อนเดียวต่อ WBS (ถ้ามีหลาย WBS จะแยกหนึ่งกลุ่มต่อ WBS)
  const map=new Map();
  base.forEach(r=>{
    const key=r.wbs||bd.wbs||'WBS';
    if(!map.has(key)) map.set(key,Object.assign({},r,{qty:0,amount:0,wbs:key,names:[]}));
    const g=map.get(key); g.qty+=r.qty; g.amount+=r.amount; g.names.push(r.name);
    if(!g.network&&r.network) g.network=r.network; if(!g.gl&&r.gl) g.gl=r.gl;
  });
  return Array.from(map.values()).map((g,i)=>{g.no=i+1;g.name=[...new Set(g.names)].join(' / ');g.unitPrice=g.qty?g.amount/g.qty:0;return g;});
}
function validateStep4Doc(p){
  const d=ensureStep4Defaults(p,true), errs=[];
  if(!p.items||!p.items.length) errs.push('ยังไม่มีรายการพัสดุ/งาน');
  if(!d.headerNote) errs.push('ยังไม่มีบันทึกส่วนหัว (Header Note)');
  if(p.budget&&p.budget.sourceKey==='wbs' && !(p.budget.data||{}).wbs && !(p.items||[]).some(x=>x.wbs)) errs.push('กรุณาระบุหมายเลขงาน WBS');
  if(p.budget&&p.budget.sourceKey!=='wbs'){
    const need=prRows(p).length, codes=Array.isArray(d.orderCodes)?d.orderCodes:[];
    if(need && codes.filter(x=>String(x||'').trim()).length<need) errs.push('กรุณากรอกรหัสใบสั่งให้ครบทั้ง '+need+' รายการในขั้นตอน PR');
  }
  return errs;
}
