    '<div class="inspect-pay"><b>เรียน '+E(attn)+' (หัวหน้าหน่วยงานของรัฐ)</b>'+
    '<p class="inspect-indent">คณะกรรมการตรวจรับพัสดุ ได้ตรวจรับพัสดุ'+(resultOK?'ถูกต้อง':'ตามผลที่ระบุข้างต้น')+
      ' และได้รับมอบพัสดุดังกล่าวแล้ว '+E(W.seller)+'ควรได้รับเงินเป็นจำนวนทั้งสิ้น '+money(t.grand)+
      ' บาท ('+E(bahtText(t.grand))+') ราคารวมภาษีมูลค่าเพิ่ม '+E(String(p.vatRate||DB.settings.defaultVat||7))+'%</p>'+
    '<p class="inspect-indent">จึงเรียนมาเพื่อโปรดพิจารณาอนุมัติเบิกจ่าย</p></div>'+
    '<table class="inspect-approve"><tr><td style="width:55%">ลงชื่อ.........................................เจ้าหน้าที่<br>'+
      '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;('+E(d.receiverName||'')+')</td>'+
      '<td>- ทราบ<br>- อนุมัติ<br><br>ลงชื่อ......................................................<br>(....................................................)</td></tr></table>'+
    '</div></div>';

  const imgs=d.images||[];
  const photoPages=imgs.map((src,i)=>
    '<div class="sheet inspect-page"><div class="page-tag">รูปภาพประกอบ '+(i+1)+' / '+imgs.length+'</div><div class="sheet-in">'+
      '<div class="inspect-photo-title">รูปภาพประกอบ</div>'+
      '<div class="inspect-photo-wrap"><img src="'+src+'" alt="รูปภาพประกอบ '+(i+1)+'"></div>'+
      '<div class="inspect-photo-caption">'+E(workName)+'</div>'+
    '</div></div>'
  ).join('');
  return page1+photoPages;
}
function validateStep6Doc(p){
  ensureStep6Defaults(p);
  const d=p.workflow.s6.data, s5=(p.workflow.s5&&p.workflow.s5.data)||{}, miss=[];
  if(!s5.dueDate) miss.push('วันที่ครบกำหนดส่งมอบ (STEP 5)');
  if(!s5.deliveredDate) miss.push('วันที่ส่งมอบจริง (STEP 5)');
  if(!d.inspectDate) miss.push('วันที่ตรวจรับ');
  if(!d.inspectResult) miss.push('ผลการตรวจรับ');
  if(!d.itemCount) miss.push('จำนวนรายการที่ตรวจรับ');
  if(!d.acceptedFromDate) miss.push('วันที่ให้ถือว่าตรวจรับ');
  if(!d.receiverName) miss.push('ผู้รับมอบพัสดุ / เจ้าหน้าที่');
  if(!(p.committee||[]).length) miss.push('คณะกรรมการตรวจรับ');
  return miss;
}
function tryOpenDocPreview6(p){
  const miss=validateStep6Doc(p);
  if(miss.length){
    openModal({
      title:'ยังดูตัวอย่างรายงานตรวจรับไม่ได้',
      body:'<div class="alert warn"><b>ข้อมูลยังไม่ครบ '+miss.length+' รายการ</b><br>'+
           'กรุณากรอกข้อมูลด้านล่าง แล้วกดดูตัวอย่างรายงานตรวจรับอีกครั้ง</div>'+
           '<ul style="margin:12px 0 4px 22px;padding:0">'+
           miss.map(x=>'<li style="margin-bottom:7px">'+esc(x)+'</li>').join('')+
           '</ul><div class="hint" style="margin-top:10px">รายการที่ระบุว่า STEP 5 ให้กลับไปกรอกในขั้นตอน “ส่งมอบสินค้า / งาน” ส่วนรายการอื่นกรอกใน STEP 6 “ตรวจรับ”</div>'
    });
    return;
  }
  try{
    openDocPreview6(p);
  }catch(err){
    console.error('STEP6 preview error',err);
    alert('ไม่สามารถสร้างตัวอย่างรายงานตรวจรับ\n\n'+
          'ข้อมูลครบแล้ว แต่ระบบพบข้อผิดพลาดขณะสร้างรายงาน\n'+
          'รายละเอียด: '+(err && err.message ? err.message : String(err)));
  }
}
function openDocPreview6(p){
  const root=$('#printRoot'), html=step6DocHTML(p);
  const pageCount=(html.match(/class="sheet inspect-page"/g)||[]).length;
  root.innerHTML='<div class="doc-viewer">'+
    '<div class="doc-toolbar"><button class="btn" id="docClose6">← กลับไปแก้ไข</button>'+
    '<b>ตัวอย่างรายงานตรวจรับ — '+esc(p.code)+'</b>'+
    '<span class="hint" style="color:#A9C0D6">A4 • '+pageCount+' หน้า</span><span class="sp"></span>'+
    '<button class="btn primary" id="docPrint6">🖨 พิมพ์ / บันทึก PDF</button></div>'+
    '<div class="doc-stage">'+html+'</div></div>';

  /* ใช้กลไก Preview เดียวกับ STEP 1–4
     #printRoot ถูกซ่อนไว้เป็นค่าเริ่มต้น จึงต้องเปิด display และ body.has-doc */
  root.style.display='block';
  document.body.classList.add('has-doc');
  enterDocPreviewHistory();
  root.scrollTop=0;

  $('#docClose6').onclick=closeDocPreview;
  $('#docPrint6').onclick=()=>window.print();
  document.addEventListener('keydown', escDoc);
}

function openDocPreview4(p){
  const root=$('#printRoot');
  const docHtml=step4DocHTML(p);
  const pageCount=(docHtml.match(/class="sheet pr-page"/g)||[]).length;
  root.innerHTML='<div class="doc-viewer"><div class="doc-toolbar"><button class="btn" id="docBack4">← กลับไปแก้ไข</button><b>ตัวอย่างเอกสาร PR — '+esc(p.code)+'</b><div class="sp"></div><span class="hint" style="color:#A9C0D6">A4 แนวนอน • '+pageCount+' หน้า • STEP 4 PR</span><button class="btn primary" id="docPrint4">🖨 พิมพ์ / บันทึก PDF</button></div><div class="doc-hint">ภาพเสมือนจริงของกระดาษ A4 ใช้ Template เดียวกับตอนสั่งพิมพ์</div>'+docHtml+'</div>';
  // ใช้กลไก Preview เดียวกับ STEP 1–3: #printRoot ถูกซ่อนไว้เป็นค่าเริ่มต้น
  // จึงต้องเปิด display และ has-doc โดยตรง มิฉะนั้นสร้าง HTML แล้วแต่ผู้ใช้จะมองไม่เห็น
  root.style.display='block';
  document.body.classList.add('has-doc');
  enterDocPreviewHistory();
  $('#docBack4').onclick=closeDocPreview;
  $('#docPrint4').onclick=()=>window.print();
  document.addEventListener('keydown', escDoc);
  root.scrollTop=0;
}
function tryOpenDocPreview4(p){
  const errs=validateStep4Doc(p);
  if(errs.length){ window.alert('ข้อมูล STEP 4 ยังไม่ครบ\n\n'+errs.join('\n')); return; }
  openDocPreview4(p);
}
